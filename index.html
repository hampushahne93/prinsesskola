<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kungliga klädskåpet</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#5a2d82;--gold:#ffcf3a;--gold-d:#d99a12}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#ffe3f4 0%,#efe2ff 55%,#dff0ff 100%);user-select:none;-webkit-user-select:none}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .hidden{display:none!important}

  /* START */
  #start{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:20px;position:relative}
  #start h1{margin:0;text-align:center;font-size:clamp(34px,7vw,64px);line-height:1;font-weight:700;
    background:linear-gradient(180deg,#ffd75a,#f0a31b);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #9a5bd6) drop-shadow(0 6px 10px rgba(120,60,180,.25))}
  .crownTop{font-size:clamp(40px,8vw,70px);animation:float 3s ease-in-out infinite}
  .sub{margin:0;font-size:clamp(20px,4vw,30px);font-weight:600}
  .choose{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center}
  .pick{width:min(40vw,240px);background:#fff;border-radius:32px;padding:12px 12px 14px;
    box-shadow:0 8px 0 #e4c8f5,0 14px 30px rgba(120,60,180,.18);transition:transform .15s;display:flex;flex-direction:column;align-items:center}
  .pick:active{transform:scale(.95)}
  .pick .pv{width:100%;height:min(40vh,300px);display:grid;place-items:center}
  .pick img{width:100%;height:100%;object-fit:contain}
  .pick span{font-size:clamp(24px,4.5vw,36px);font-weight:700;margin-top:4px}
  .pick[data-g="girl"] span{color:#ff5aa8}
  .pick[data-g="boy"] span{color:#4a6fe0}
  .pick:disabled{opacity:.6}
  .twinkle{position:absolute;pointer-events:none;animation:tw 2.4s ease-in-out infinite;opacity:.7}
  .loading{font-size:40px;animation:spin 1.4s linear infinite}
  #err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-size:24px;background:#fff0fa;z-index:50}

  /* DRESS */
  #dress{height:100dvh;display:flex;flex-direction:column}
  .stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 6px 20px rgba(90,45,130,.15);background:#cfe9ff}
  #c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c3d:active{cursor:grabbing}
  .fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .fx span{position:absolute;animation:burst .9s ease-out forwards}
  .topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .topbar .spacer{flex:1;pointer-events:none}
  .round{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);font-size:28px;
    box-shadow:0 4px 0 rgba(150,100,190,.35);display:grid;place-items:center;transition:transform .12s}
  .round:active,.pill:active{transform:scale(.9)}
  .pill{height:56px;padding:0 22px;border-radius:30px;font-size:26px;font-weight:700;color:#7a3f00;
    background:linear-gradient(180deg,#ffe27a,#ffbf2e);box-shadow:0 5px 0 #d08a10,0 8px 18px rgba(200,130,0,.3)}
  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:8px 18px;border-radius:20px;
    font-size:20px;font-weight:600;box-shadow:0 3px 0 rgba(150,100,190,.3);pointer-events:none;transition:opacity .6s;animation:nudge 1.6s ease-in-out infinite;white-space:nowrap}

  .panel{flex:0 0 auto;height:46%;display:flex;flex-direction:column;padding:10px 10px 12px;gap:8px;min-height:0}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;flex:0 0 auto;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;width:62px;height:62px;border-radius:20px;background:#fff;font-size:32px;display:grid;place-items:center;
    box-shadow:0 4px 0 #ead4f7;transition:transform .12s,background .2s}
  .tab svg{width:38px;height:38px}
  .tab.on{background:linear-gradient(180deg,#ffb3dc,#ff86c4);box-shadow:0 4px 0 #e0559c;transform:translateY(-3px) scale(1.06)}
  .items{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,100px);grid-auto-rows:100px;gap:10px;padding:4px;align-content:start;justify-content:center}
  .item{width:100%;height:100%;border-radius:22px;background:radial-gradient(circle at 50% 40%,#fff 0%,#fdf0ff 100%);border:4px solid #fff;box-shadow:0 4px 0 #ead4f7;overflow:hidden;position:relative;transition:transform .12s;padding:0}
  .item img{width:100%;height:100%;display:block;object-fit:cover}
  .item .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;opacity:.35;animation:tw 1.2s ease-in-out infinite}
  .item:active{transform:scale(.92)}
  .item.on{border-color:var(--gold);box-shadow:0 0 0 3px #fff3b0,0 4px 0 var(--gold-d),0 0 18px rgba(255,200,40,.7)}
  .item.on::after{content:'⭐';position:absolute;top:2px;right:4px;font-size:18px}
  .item .none{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:.55}
  .colors{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:4px 4px 6px}
  .colors::-webkit-scrollbar{display:none}
  .col{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(120,60,180,.25);transition:transform .12s}
  .col.on{transform:scale(1.18);box-shadow:0 0 0 3px var(--gold),0 3px 0 rgba(120,60,180,.25)}
  .col:active{transform:scale(.9)}

  /* SHOW MODE */
  .showui{position:absolute;inset:0;pointer-events:none}
  .showtitle{position:absolute;top:4%;left:0;right:0;text-align:center;font-size:clamp(30px,6vw,56px);font-weight:700;color:#fff;
    text-shadow:0 3px 0 #b0459a,0 0 18px rgba(255,120,200,.9);padding:0 16px;animation:pop .6s ease-out}
  .confetti{position:absolute;inset:0;overflow:hidden}
  .confetti span{position:absolute;top:-10%;animation:fall linear forwards}
  #back{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);pointer-events:auto}
  #back:active{transform:translateX(-50%) scale(.92)}
  #dress.playing .panel,#dress.playing .topbar,#dress.playing .hint{display:none}
  #dress.playing .stage{border-radius:0}
  .worldui{position:absolute;inset:0;pointer-events:none}
  .worldui>*{pointer-events:auto}
  .wtop{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none}
  .wtop>*{pointer-events:auto}.wtop .spacer{flex:1;pointer-events:none}
  .wpill{font-size:22px;height:52px;padding:0 18px}
  .wq{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 4px 0 rgba(150,100,190,.35);font-size:18px}
  .whint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:10px 20px;border-radius:22px;font-size:18px;
    text-align:center;box-shadow:0 3px 0 rgba(150,100,190,.3);transition:opacity 1s;pointer-events:none;width:max-content;max-width:94%}
  body.touch .whint{display:none}
  .joy{display:none;position:absolute;left:28px;bottom:28px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.35);border:4px solid rgba(255,255,255,.8);touch-action:none}
  .knob{position:absolute;left:50%;top:50%;width:66px;height:66px;border-radius:50%;background:linear-gradient(180deg,#ffb3dc,#ff86c4);box-shadow:0 4px 0 #e0559c;transform:translate(-50%,-50%)}
  .jumpbtn{display:none;position:absolute;right:30px;bottom:40px;width:96px;height:96px;border-radius:50%;font-size:44px;background:linear-gradient(180deg,#ffe27a,#ffbf2e);box-shadow:0 6px 0 #d08a10;touch-action:none}
  body.touch .joy,body.touch .jumpbtn{display:block}
  .welcome{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:clamp(28px,5vw,52px);font-weight:700;color:#fff;pointer-events:none;
    text-shadow:0 3px 0 #b0459a,0 0 18px rgba(255,120,200,.9);animation:welcome 3.5s ease-out forwards}
  #roomname{top:24%;font-size:clamp(24px,4vw,40px);animation-duration:2.6s}
  .wload{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:linear-gradient(160deg,#ffe3f4,#dff0ff);font-size:28px;font-weight:600}
  @keyframes welcome{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

  @media (min-aspect-ratio: 1/1){
    #dress{flex-direction:row}
    .stage{border-radius:0 28px 28px 0}
    .panel{height:auto;width:min(44vw,430px);padding:12px}
    .items{grid-template-columns:repeat(auto-fill,112px);grid-auto-rows:112px}
    .tabs{flex-wrap:wrap;justify-content:center;overflow:visible;-webkit-mask-image:none;mask-image:none}
  }
  @keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  @keyframes tw{0%,100%{transform:scale(.7);opacity:.3}50%{transform:scale(1.05);opacity:.9}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes nudge{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 10px))}}
  @keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(40deg);opacity:0}}
  @keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"}}</script>

<body>

<div id="start">
  <div class="crownTop">👑</div>
  <h1>Kungliga<br>klädskåpet</h1>
  <p class="sub">Vem vill du vara?</p>
  <div class="choose">
    <button class="pick" data-g="girl" disabled><div class="pv" id="pg"><div class="loading">✨</div></div><span>Tjej</span></button>
    <button class="pick" data-g="boy" disabled><div class="pv" id="pb"><div class="loading">✨</div></div><span>Kille</span></button>
  </div>
</div>

<div id="dress" class="hidden">
  <div class="stage" id="stage">
    <canvas id="c3d"></canvas>
    <div class="fx" id="fx"></div>
    <div class="hint" id="hint">👆 Dra för att snurra!</div>
    <div class="topbar">
      <button id="home" class="round" aria-label="Börja om">🏠</button>
      <div class="spacer"></div>
      <button id="sound" class="round" aria-label="Ljud">🔊</button>
      <button id="magic" class="round" aria-label="Trolla">🎲</button>
      <button id="done" class="pill">🏰 Starta spelet</button>
    </div>
    <div class="worldui hidden" id="worldui">
      <div class="wtop"><button id="wback" class="pill wpill">👗 Klädskåpet</button><div class="spacer"></div><button id="wq" class="pill wpill wq">⚙️ Hög</button><button id="wsound" class="round">🔊</button></div>
      <div class="whint" id="whint">⌨️ Gå: <b>W A S D</b> eller <b>piltangenterna</b> · Hoppa: <b>mellanslag</b> · Spring: <b>Shift</b><br>🖱️ Dra med musen för att titta runt · <b>Mushjulet</b> zoomar · <b>Klicka på djuren!</b></div>
      <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
      <button class="jumpbtn" id="jumpbtn" aria-label="Hoppa">⬆️</button>
      <div class="welcome hidden" id="welcome">✨ Välkommen till Sagolandet! ✨</div>
      <div class="welcome hidden" id="roomname"></div>
      <div class="wload hidden" id="wload"><div class="loading">🏰</div>Bygger sagolandet…</div>
    </div>
  </div>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
    <div class="colors" id="colors"></div>
  </div>
</div>

<div id="err" class="hidden"></div>

<script>
  // Visar ett vänligt meddelande om 3D-motorn inte går att ladda
  setTimeout(function(){ if(!window.__ok){ var e=document.getElementById('err'); e.classList.remove('hidden');
    e.innerHTML='👑<br>Slottet laddar inte just nu.<br><small>Kolla internet och ladda om sidan.</small>'; } }, 12000);
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ======================================================================
   HJÄLPARE
   ====================================================================== */
const $ = s => document.querySelector(s);
const PI = Math.PI;
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const G = '#ffcf3a', GD = '#d99a12';
function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function shade(h,a){const c=hex2rgb(h);const t=a<0?0:255,p=Math.abs(a);
  return '#'+c.map(v=>Math.round(v+(t-v)*p).toString(16).padStart(2,'0')).join('');}
function rng(seed){seed=Math.floor(seed);if(seed<=0)seed=Math.abs(seed)+1;return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}

/* Tecknad (toon) ljussättning */
const gradMap = (()=>{const d=new Uint8Array([120,120,120,255, 200,200,200,255, 255,255,255,255]);
  const t=new THREE.DataTexture(d,3,1);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const MC = new Map();
let MATMODE='toon';
function M(color,o={}){const k=MATMODE[0]+color+JSON.stringify(o);let m=MC.get(k);
  if(!m){if(MATMODE==='std'){const {emissive,emissiveIntensity,side,transparent,opacity,metalness,roughness}=o;
      m=new THREE.MeshStandardMaterial({color,roughness:roughness??.62,metalness:metalness??0,...(emissive?{emissive,emissiveIntensity:emissiveIntensity??1}:{}),...(side!==undefined?{side}:{}),...(transparent?{transparent,opacity}:{})});}
    else m=new THREE.MeshToonMaterial({color,gradientMap:gradMap,...o});MC.set(k,m);}return m;}
function MB(color,o={}){const k='b'+color+JSON.stringify(o);let m=MC.get(k);
  if(!m){m=new THREE.MeshBasicMaterial({color,...o});MC.set(k,m);}return m;}
const DS = THREE.DoubleSide;
const gold = () => MATMODE==='std'?M('#ffcf52',{metalness:.9,roughness:.28}):M(G,{emissive:'#7a5200',emissiveIntensity:.35});
const goldDS = () => MATMODE==='std'?M('#ffcf52',{metalness:.9,roughness:.28,side:DS}):M(G,{emissive:'#7a5200',emissiveIntensity:.35,side:DS});
const silver = () => MATMODE==='std'?M('#eef2ff',{metalness:.85,roughness:.22}):M('#e8eeff',{emissive:'#5a6a99',emissiveIntensity:.2});
const gem = c => MATMODE==='std'?M(c,{emissive:c,emissiveIntensity:.25,roughness:.08,metalness:.2}):M(c,{emissive:c,emissiveIntensity:.35});

function mk(geo,m,p,r,s){const o=new THREE.Mesh(geo,m);if(p)o.position.set(p[0],p[1],p[2]);if(r)o.rotation.set(r[0],r[1],r[2]);
  if(s!=null){if(typeof s==='number')o.scale.setScalar(s);else o.scale.set(s[0],s[1],s[2]);}return o;}
const sph = (r,m,p,s,seg=22) => mk(new THREE.SphereGeometry(r,seg,Math.max(6,seg*.66|0)),m,p,null,s);
function limb(a,b,r,m,cap=true){const d=b.clone().sub(a);const len=d.length();
  const g=cap?new THREE.CapsuleGeometry(r,len,6,16):new THREE.CylinderGeometry(r,r,len,18);
  const o=new THREE.Mesh(g,m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return o;}
function cone(a,b,ra,rb,m,open=false){const d=b.clone().sub(a);const len=d.length();
  const o=new THREE.Mesh(new THREE.CylinderGeometry(rb,ra,len,24,1,open),m);o.position.copy(a).add(b).multiplyScalar(.5);
  o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return o;}
function ring(center,dir,R,tube,m,arc=PI*2){const o=new THREE.Mesh(new THREE.TorusGeometry(R,tube,10,40,arc),m);
  o.position.copy(center);o.quaternion.setFromUnitVectors(V(0,0,1),dir.clone().normalize());return o;}
function cyl(rt,rb,h,m,p,o={}){const g=new THREE.CylinderGeometry(rt,rb,h,o.seg||40,o.hs||1,!!o.open,o.ts||0,o.tl||PI*2);
  if(o.pleat)pleat(g,...o.pleat);return mk(g,m,p,o.r,o.s);}
function lathe(pts,m,o={}){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),o.seg||72,o.ps||0,o.pl||PI*2);
  if(o.pleat)pleat(g,...o.pleat);return mk(g,m,o.p,null,o.s);}
/* veck: radien vågas mer ju längre ner */
function pleat(g,n,amp,yTop,yBot,ph=0){const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const f=Math.min(1,Math.max(0,(yTop-y)/(yTop-yBot)));const k=1+amp*f*Math.sin(Math.atan2(x,z)*n+ph);p.setXYZ(i,x*k,y,z*k);}
  p.needsUpdate=true;g.computeVertexNormals();}
function radiusAt(pts,y){for(let i=0;i<pts.length-1;i++){const [r0,y0]=pts[i],[r1,y1]=pts[i+1];
  if((y<=y0&&y>=y1)||(y>=y0&&y<=y1)){const t=(y-y0)/((y1-y0)||1);return r0+(r1-r0)*t;}}return pts[pts.length-1][0];}
/* utspridda saker på en kjol-yta */
function onSkirt(pts,n,seed,make,phiMin=-PI,phiMax=PI,yMin,yMax,out=.03){const R=rng(seed);const arr=[];
  const ys=pts.map(p=>p[1]);yMin=yMin??Math.min(...ys)+.08;yMax=yMax??Math.max(...ys)-.15;
  for(let i=0;i<n;i++){const y=yMin+R()*(yMax-yMin),ph=phiMin+R()*(phiMax-phiMin);const r=radiusAt(pts,y)*(1+out)+.02;
    const o=make(i);o.position.set(r*Math.sin(ph),y,r*Math.cos(ph));o.lookAt(o.position.x*2,y,o.position.z*2);arr.push(o);}return arr;}
function starShape(r){const s=new THREE.Shape();for(let i=0;i<10;i++){const a=PI/2+i*PI/5,rr=i%2?r*.45:r;
  const x=rr*Math.cos(a),y=rr*Math.sin(a);i?s.lineTo(x,y):s.moveTo(x,y);}s.closePath();return s;}
const extr=(shape,d)=>{const g=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:d*.4,bevelSize:d*.4,bevelSegments:2,curveSegments:10});g.center();return g;};
const starGeo=(r,d=.05)=>extr(starShape(r),d);
function heartGeo(r,d=.05){const s=new THREE.Shape();s.moveTo(0,-r);s.bezierCurveTo(-r*1.3,-r*.1,-r*.9,r*1.05,0,r*.4);
  s.bezierCurveTo(r*.9,r*1.05,r*1.3,-r*.1,0,-r);return extr(s,d);}
function flower(col,r=.07){const g=new THREE.Group();for(let i=0;i<5;i++){const a=i*PI*2/5;g.add(sph(r,M(col),[Math.cos(a)*r*1.1,Math.sin(a)*r*1.1,0],[1,1,.5],12));}
  g.add(sph(r*.75,M('#ffd84a'),[0,0,r*.25],[1,1,.6],12));return g;}
function snowflake(r,m){const g=new THREE.Group();for(let i=0;i<3;i++)g.add(mk(new THREE.BoxGeometry(r*2,r*.16,r*.1),m,[0,0,0],[0,0,i*PI/3]));
  for(let i=0;i<6;i++){const a=i*PI/3;for(const s of[-1,1])g.add(mk(new THREE.BoxGeometry(r*.45,r*.1,r*.08),m,[Math.cos(a)*r*.62+Math.cos(a+s*PI/4)*r*.15,Math.sin(a)*r*.62+Math.sin(a+s*PI/4)*r*.15,0],[0,0,a+s*PI/4]));}return g;}
function butterfly(c1,c2,s=1){const g=new THREE.Group();for(const sx of[-1,1]){g.add(mk(new THREE.CircleGeometry(.14*s,20),M(c1,{side:DS}),[.13*s*sx,.07*s,0],[0,0,sx*.3],[1,1.25,1]));
  g.add(mk(new THREE.CircleGeometry(.09*s,16),M(c2,{side:DS}),[.1*s*sx,-.1*s,.002],[0,0,-sx*.3]));}g.add(limb(V(0,-.15*s,.01),V(0,.15*s,.01),.025*s,M('#5a2d82')));return g;}

const HY=3.75, HC=V(0,HY,0);
function facePt(x,y,d=0){const v=y/.95;const z=.94*Math.sqrt(Math.max(0,1-x*x-v*v));return V(x,HY+y,z+d);}
function onFace(o,x,y,d=0){const p=facePt(x,y,d);o.position.copy(p);const n=V(x,y/.95,p.z/.94).normalize();o.lookAt(p.clone().add(n));return o;}
const ARM=sx=>[V(.46*sx,2.42,0),V(.76*sx,1.62,.06)];
const HAND=sx=>V(.78*sx,1.5,.07);

function buildBody(st,add,refs){
  const sk=M(st.skin);
  for(const sx of[-1,1])add(limb(V(.2*sx,.2,0),V(.2*sx,1.55,0),.15,sk));
  add(sph(.37,sk,[0,1.62,0],[1,.6,.8]));
  add(cyl(.40,.34,1.0,sk,[0,2.05,0],{s:[1,1,.78]}));
  for(const sx of[-1,1]){const [a,b]=ARM(sx);add(sph(.17,sk,[.42*sx,2.42,0]));add(limb(a,b,.11,sk));const h=HAND(sx);add(sph(.15,sk,[h.x,h.y,h.z],[1,1.1,1]));}
  add(cyl(.15,.16,.6,sk,[0,2.72,0]));
  add(sph(1,sk,[0,HY,0],[1,.95,.94],40));
  for(const sx of[-1,1])add(sph(.18,sk,[.97*sx,HY-.05,0],[.6,1,1]));
  // ansikte
  const eyeM=M('#2d2140');
  for(const sx of[-1,1]){
    const e=onFace(sph(.19,eyeM,null,null),.36*sx,-.02,-.06);e.scale.set(.82,1.1,.42);add(e);refs.eyes.push(e);
    const h1=onFace(sph(.065,MB('#ffffff')),.36*sx+.06,.07,.03);add(h1);refs.eyes.push(h1);
    const h2=onFace(sph(.03,MB('#ffffff')),.36*sx-.06,-.1,.03);add(h2);refs.eyes.push(h2);
    const br=onFace(mk(new THREE.TorusGeometry(.14,.022,8,16,PI*.6),M('#6a4a3a')),.36*sx,.3,.01);br.rotateZ(PI*.2);add(br);
    const ch=onFace(mk(new THREE.CircleGeometry(.15,24),MB('#ff6f9f',{transparent:true,opacity:.35})),.56*sx,-.24,.012);add(ch);
    if(st.gender==='girl'){for(let i=0;i<3;i++){const l=onFace(mk(new THREE.CapsuleGeometry(.014,.09,4,6),eyeM),(.36+.13+i*.025)*sx,.1+i*.05,.02);l.rotateZ(sx*(-.9+i*.25));add(l);}}
  }
  add(onFace(sph(.06,M(shade(st.skin,-.08))),0,-.16,.0));
  const mo=onFace(mk(new THREE.TorusGeometry(.15,.04,8,20,PI),M('#c2456a')),0,-.3,.01);mo.rotateZ(PI);add(mo);
  add(onFace(mk(new THREE.CircleGeometry(.13,20,PI,PI),MB('#e0607e')),0,-.31,.005));
}

function hairCap(m,add,back=.6){
  add(mk(new THREE.SphereGeometry(1.08,40,20,0,PI*2,0,PI*.4),m,[0,HY,0],null,[1,.97,.97]));
  add(mk(new THREE.SphereGeometry(1.08,40,20,PI*.9,PI*1.2,0,PI*back),m,[0,HY,0],null,[1,.97,.97]));
}
function bangsStraight(m,add){for(let i=0;i<7;i++){const x=-.6+i*.2;add(onFace(sph(.19,m,null,[1,1.25,.55]),x,.38+.08*x*x,.02));}}
function bangsSwept(m,add){for(let i=0;i<6;i++){const t=i/5;add(onFace(sph(.25-.06*t,m,null,[1.2,.9,.55]),-.62+t*1.2,.3+t*.28,.02));}}
function curlRing(m,add,yTop,yBot,r=1.02,sz=.25,seed=3){const R=rng(seed);
  for(let y=yTop;y>=yBot;y-=.32){for(let a=PI*.38;a<=PI*1.62;a+=.34){const rr=r+R()*.06;add(sph(sz+R()*.05,m,[rr*Math.sin(a),y,rr*Math.cos(a)],null,14));}}}
function braidChain(m,add,sx){let last;for(let i=0;i<8;i++){const t=i/7;const p=V(sx*(.92-.1*t),HY-.35-t*1.55,-.15+t*.5);last=p;add(sph(.17-.03*t,m,[p.x,p.y,p.z],null,14));}
  add(sph(.07,M('#ff5aa8'),[last.x,last.y-.12,last.z]));for(const s of[-1,1])add(cone(V(last.x,last.y-.12,last.z),V(last.x+s*.16,last.y-.06,last.z+.05),.03,.09,M('#ff7fbf')));}

function tiaraBand(m,R=.7,tube=.05){const r=mk(new THREE.TorusGeometry(R,tube,10,40,PI),m);r.rotation.set(PI/2,0,0);return r;}
function placeTiara(g,add,y=-.18,tilt=-.32){g.position.set(0,CY+y,0);g.rotation.x=tilt;add(g);}
function crownPoints(m,R,y,n,h,arc=PI*2,start=0,ball=true){const g=new THREE.Group();for(let i=0;i<n;i++){const a=start+(arc===PI*2?i/n:i/(n-1))*arc;
  const x=R*Math.sin(a),z=R*Math.cos(a);g.add(mk(new THREE.ConeGeometry(.1,h,4),m,[x,y+h/2,z],[0,a+PI/4,0]));if(ball)g.add(sph(.06,M('#fff6c0',{emissive:'#ffcf3a',emissiveIntensity:.3}),[x,y+h+.03,z],null,12));}return g;}

const byId=(list,id)=>list.find(x=>x.id===id)||list[0];
function buildChar(st,opt={}){
  const root=new THREE.Group();const refs={eyes:[],spin:[],flap:[],glow:[],bob:[]};const add=o=>{root.add(o);return o;};
  const tag=fn=>o=>{o.userData.part=fn(o);root.add(o);return o;};
  buildBody(st,tag(limbPart),refs);
  if(!opt.noOutfit)byId(ALL_OUT,st.outfit).build(st.outfitColor,tag(limbPart));
  _hc=st.hairColor;if(!opt.noHair)byId(HAIRS,st.hairStyle).build(M(st.hairColor),add);
  if(!opt.noCrown){const cg=new THREE.Group();byId(CROWNS,st.crown).build(o=>{cg.add(o);return o;});cg.position.y=byId(HAIRS,st.hairStyle).lift||0;add(cg);}
  byId(CAPES,st.cape).build(st.capeColor,add,refs);
  byId(SHOES,st.shoes).build(tag(o=>o.position.x<0?'legL':'legR'),st,refs);
  byId(NECKS,st.necklace).build(add);
  byId(ACCS,st.acc).build(tag(()=>'armR'),refs);
  refs.eyes.forEach(e=>e.userData.sy=e.scale.y);
  [...refs.eyes,...refs.spin,...refs.flap,...refs.glow,...refs.bob].forEach(o=>o.userData.keep=true);
  root.userData.refs=refs;return root;
}
/* vilken kroppsdel en bit hör till (för gånganimationen) */
function limbPart(o){const p=o.position,ax=Math.abs(p.x);
  if(p.y<1.56&&Math.hypot(ax-.2,p.z)<.3)return p.x<0?'legL':'legR';
  if(ax>.38&&p.y>1.25&&p.y<2.48){const sx=Math.sign(p.x);const a=V(.46*sx,2.42,0),ab=V(.32*sx,-.92,.07);const t=Math.max(0,Math.min(1,p.clone().sub(a).dot(ab)/ab.lengthSq()));
    if(a.clone().add(ab.clone().multiplyScalar(t)).distanceTo(p)<.34)return sx<0?'armL':'armR';}
  return 'body';}
/* lägg ben och armar i egna leder så att de kan svinga */
function rigChar(root){const J={legL:V(-.2,1.58,0),legR:V(.2,1.58,0),armL:V(-.46,2.42,0),armR:V(.46,2.42,0)};const piv={};
  for(const k in J){const g=new THREE.Group();g.position.copy(J[k]);g.userData.keep=true;piv[k]=g;}
  [...root.children].forEach(o=>{const k=o.userData.part;if(piv[k]){root.remove(o);o.position.sub(J[k]);if(o.userData.by!==undefined)o.userData.by-=J[k].y;piv[k].add(o);}});
  for(const k in piv)root.add(piv[k]);root.userData.rig=piv;return root;}
function disposeTree(o){o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material&&n.material.userData&&n.material.userData.own)n.material.dispose();});}

  const notes=kind==='done'?[523,659,784,1047,1319,1568]:kind==='tab'?[660]:kind==='spin'?[784,988,1175,1568]:[988+Math.floor(Math.random()*4)*110,1480];
  notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
    const t=ac.currentTime+i*(kind==='done'?.11:.07);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='tab'?.08:.16,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.6);});}catch(e){}}

function animRefs(obj,dt){const r=obj.userData.refs;const u=obj.userData;if(u.nb===undefined)u.nb=tt+2;
  if(tt>u.nb){const k=tt-u.nb;const f=k<.14?Math.max(.1,1-Math.sin(k/.14*PI)*.9):1;r.eyes.forEach(e=>e.scale.y=e.userData.sy*f);if(k>.14)u.nb=tt+2.5+Math.random()*3;}
  r.spin.forEach(o=>o.rotation.y+=dt*2.5);r.glow.forEach((o,i)=>o.material.color.setHSL((tt*.7+i*.17)%1,1,.6));r.bob.forEach(o=>{o.position.y=o.userData.by+Math.sin(tt*1.6)*.1;o.rotation.z=Math.sin(tt*1.1)*.12;});
  r.flap.forEach(o=>o.rotation.y=o.userData.base-o.userData.sx*Math.sin(tt*5)*.28);}

function camFree(tgt,yaw,pit,dis){const cp=Math.cos(pit);const w=V(tgt.x+Math.sin(yaw)*cp*dis,tgt.y+Math.sin(pit)*dis,tgt.z+Math.cos(yaw)*cp*dis);let best=1;const dx=w.x-tgt.x,dz=w.z-tgt.z;
  const Lh=Math.hypot(dx,dz)||1;for(const [x0,z0,x1,z1,top,th] of INWALLS){const ex=x1-x0,ez=z1-z0;const den=dx*ez-dz*ex;if(Math.abs(den)<1e-6)continue;const ox=x0-tgt.x,oz=z0-tgt.z;
    const u=(ox*ez-oz*ex)/den,v=(ox*dz-oz*dx)/den;if(u>0&&v>=-.08&&v<=1.08){const y=tgt.y+(w.y-tgt.y)*u;const ue=u-((th||1)/2+.7)/Lh;if(y<top+.6&&ue<best)best=Math.max(0,ue);}}return best;}
function camClamp(tgt,want){let best=1;const dx=want.x-tgt.x,dz=want.z-tgt.z;
  const Lh=Math.hypot(dx,dz)||1;for(const [x0,z0,x1,z1,top,th] of INWALLS){const ex=x1-x0,ez=z1-z0;const den=dx*ez-dz*ex;if(Math.abs(den)<1e-6)continue;const ox=x0-tgt.x,oz=z0-tgt.z;
    const u=(ox*ez-oz*ex)/den,v=(ox*dz-oz*dx)/den;if(u>0&&v>=-.08&&v<=1.08){const y=tgt.y+(want.y-tgt.y)*u;const ue=u-((th||1)/2+.7)/Lh;if(y<top+.6&&ue<best)best=Math.max(0,ue);}}
  if(best<1){const k=Math.max(.1,best);want.set(tgt.x+dx*k,tgt.y+(want.y-tgt.y)*k,tgt.z+dz*k);const hd=Math.hypot(dx,dz)*k;if(hd<3.5)want.y=Math.max(want.y,tgt.y+(3.5-hd)*.9);return true;}return false;}
function showToast(t){const el=$('#roomname');el.textContent='✨ '+t+' ✨';el.classList.remove('hidden');el.style.animation='none';void el.offsetWidth;el.style.animation='';clearTimeout(W.toastT);W.toastT=setTimeout(()=>el.classList.add('hidden'),2600);}
function lockSound(){if(!audioReady())return;const m=ac.createGain();m.gain.value=.8;m.connect(ac.destination);for(let i=0;i<4;i++)noise({dest:m,at:i*.09,dur:.07,f:3200+i*300,q:6,vol:.5});voice({dest:m,at:.38,dur:.35,vol:.18,type:'square',f:[[0,880],[1,860]],lp:[[0,2500],[1,1500]]});}
function lockBubble(L){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex('🔒 Låst!'),transparent:true,depthTest:false}));s.scale.set(5.2,2.25,1);s.position.set(L.x,L.y,L.z);s.renderOrder=10;W.dyn.add(s);
  (W.tmp||(W.tmp=[])).push({s,life:2.2});lockSound();}
function updateWorld(dt){const P=W.P,C=W.cam3;globalCool-=dt;
  const K=c=>keys.has(c);let ix=0,iz=0;if(K('KeyW')||K('ArrowUp'))iz+=1;if(K('KeyS')||K('ArrowDown'))iz-=1;if(K('KeyA')||K('ArrowLeft'))ix-=1;if(K('KeyD')||K('ArrowRight'))ix+=1;
  ix+=joy.x;iz+=joy.y;const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
  if(K('KeyQ'))C.yaw+=dt*2;if(K('KeyE'))C.yaw-=dt*2;
  const fx=-Math.sin(C.yaw),fz=-Math.cos(C.yaw),rx=Math.cos(C.yaw),rz=-Math.sin(C.yaw);
  const mx=rx*ix+fx*iz,mz=rz*ix+fz*iz,ml=Math.hypot(mx,mz);const speed=(K('ShiftLeft')||K('ShiftRight'))?16:9.5;
  if(ml>.08){const nx=P.x+mx*speed*dt,nz=P.z+mz*speed*dt;
    if(walkable(nx,nz)){P.x=nx;P.z=nz;}else if(walkable(nx,P.z))P.x=nx;else if(walkable(P.x,nz))P.z=nz;
    const before={x:P.x,z:P.z};resolve(P,.9);if(!walkable(P.x,P.z)){P.x=before.x;P.z=before.z;}
    for(const an of ANIMALS){if(an.t.water)continue;const dx=P.x-an.g.position.x,dz=P.z-an.g.position.z,d=Math.hypot(dx,dz),m=an.t.r+.8;if(d<m&&d>1e-3){P.x=an.g.position.x+dx/d*m;P.z=an.g.position.z+dz/d*m;}}
    P.heading=lerpAngle(P.heading,Math.atan2(mx,mz),Math.min(1,dt*10));P.walk+=dt*speed*1.55;P.moving=true;
    if(performance.now()-W.lastCamDrag>1500&&iz>-.2)C.yaw=lerpAngle(C.yaw,P.heading+PI,Math.min(1,dt*.8*ml));}
  else P.moving=false;
  const gy=groundY(P.x,P.z);P.vy-=42*dt;P.y+=P.vy*dt;if(P.y<=gy){P.y=gy;P.vy=0;P.onGround=true;}
  W.player.position.set(P.x,P.y,P.z);W.player.rotation.y=P.heading;
  const pc=W.pc,rig=pc.userData.rig;const goal=P.moving?1:0;W.legAmp+=(goal-W.legAmp)*Math.min(1,dt*9);const la=W.legAmp,sw=Math.sin(P.walk);
  const run=(K('ShiftLeft')||K('ShiftRight'))?1.25:1;
  if(P.onGround){rig.legL.rotation.x+=((sw*.72*la*run)-rig.legL.rotation.x)*Math.min(1,dt*20);rig.legR.rotation.x+=((-sw*.72*la*run)-rig.legR.rotation.x)*Math.min(1,dt*20);
    rig.armL.rotation.x+=((-sw*.6*la*run)-rig.armL.rotation.x)*Math.min(1,dt*20);rig.armR.rotation.x+=((sw*.6*la*run*(S.acc==='none'?1:.45))-rig.armR.rotation.x)*Math.min(1,dt*20);
    rig.armL.rotation.z=rig.armR.rotation.z=0;pc.position.y=Math.abs(Math.cos(P.walk))*.12*la+Math.sin(tt*2.2)*.02*(1-la);}
  else{for(const [k,v] of[['legL',-.55],['legR',.35],['armL',-.4],['armR',-.4]])rig[k].rotation.x+=(v-rig[k].rotation.x)*Math.min(1,dt*12);rig.armL.rotation.z+=(-.5-rig.armL.rotation.z)*Math.min(1,dt*12);rig.armR.rotation.z+=(.5-rig.armR.rotation.z)*Math.min(1,dt*12);pc.position.y=0;}
  pc.rotation.z=Math.sin(P.walk)*.025*la;pc.rotation.x=.06*la*run;
  animRefs(pc,dt);
  W.blob.position.set(P.x,gy+.07,P.z);W.blob.scale.setScalar(Math.max(.45,1-(P.y-gy)*.1));
  const ins=INDOOR.find(([r])=>P.x>r[0]&&P.x<r[2]&&P.z>r[1]&&P.z<r[3]);
  W.inF=(W.inF||0)+((ins?1:0)-(W.inF||0))*Math.min(1,dt*2.5);const pit=C.pitch,dis=C.dist+(Math.min(C.dist,11)-C.dist)*W.inF;
  const tgt=V(P.x,P.y+3.1,P.z);
  if(performance.now()-W.lastCamDrag>900){const c0=camFree(tgt,C.yaw,pit,dis);if(c0<.8){const a=camFree(tgt,C.yaw+.4,pit,dis),b=camFree(tgt,C.yaw-.4,pit,dis);if(Math.max(a,b)>c0+.04)C.yaw+=(a>b?1:-1)*Math.min(1,dt*2.4);}}
  const cp=Math.cos(pit);const want=V(tgt.x+Math.sin(C.yaw)*cp*dis,tgt.y+Math.sin(pit)*dis,tgt.z+Math.cos(C.yaw)*cp*dis);
  const minY=Math.max(terrainH(want.x,want.z),WATER_Y)+1.2;if(want.y<minY)want.y=minY;
  if(ins){const top=terrainH(P.x,P.z)+ins[1]-.9;if(want.y>top)want.y=top;}
  const clamped=camClamp(tgt,want);
  if(W.snapCam||clamped){W.cam.position.lerp(want,W.snapCam?1:Math.min(1,dt*20));W.snapCam=false;}else W.cam.position.lerp(want,Math.min(1,dt*7));W.cam.lookAt(tgt);W.pc.visible=W.cam.position.distanceTo(tgt)>2.3;
  const inR=(r,m=0)=>P.x>r[0]+m&&P.x<r[2]-m&&P.z>r[1]+m&&P.z<r[3]-m;const inK=inR(KEEP,-.5)||inR(WINGC,-.5),inD=inR(DUN,-.5);
  const room=(inK||inD)?(W.rooms.find(o=>inR(o.r,.6))||null):null;const rn=room?room.n:null;if(rn&&rn!==W.lastRoom){showToast(rn);say(rn);}W.lastRoom=rn||(inK||inD?W.lastRoom:null);
  W.lockCool=(W.lockCool||0)-dt;for(const L of W.locks){if(Math.hypot(P.x-L.x,P.z-L.z)<3.2&&W.lockCool<=0){lockBubble(L);W.lockCool=3.5;}}
  W.tmp=(W.tmp||[]).filter(o=>{o.life-=dt;o.s.material.opacity=Math.min(1,o.life*2);if(o.life<=0){W.dyn.remove(o.s);o.s.material.map.dispose();o.s.material.dispose();return false;}return true;});
  W.sky.position.copy(W.cam.position);W.skyMat.uniforms.uTime.value=tt;W.grassU.uTime.value=tt;W.grassU.uPlayer.value.set(P.x,P.z);
  const sx=Math.round(P.x/3)*3,sz=Math.round(P.z/3)*3;W.sun.target.position.set(sx,0,sz);W.sun.position.set(sx+W.SUN.x*180,W.SUN.y*180,sz+W.SUN.z*180);
  W.updaters.forEach(f=>f(dt,tt));ANIMALS.forEach(a=>updAnimal(a,dt,tt));}

function enterWorld(){$('#wload').classList.remove('hidden');$('#dress').classList.add('playing');$('#worldui').classList.remove('hidden');mode='world';
  setTimeout(()=>{if(!W.built)buildWorld();renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;applyQuality(W.q||loadQ());startWorld();$('#wload').classList.add('hidden');},60);}
function startWorld(){if(W.pc){W.player.remove(W.pc);disposeTree(W.pc);}MATMODE='std';W.pc=compact(rigChar(buildChar(S)));MATMODE='toon';W.legAmp=0;W.pc.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});W.player.add(W.pc);
  Object.assign(W.P,{x:0,z:50,y:terrainH(0,50),vy:0,heading:PI,walk:0,moving:false,onGround:true});Object.assign(W.cam3,{yaw:0,pitch:.3,dist:15});W.snapCam=true;
  resize();const h=$('#whint');h.style.opacity=1;setTimeout(hideHint,12000);
  const wl=$('#welcome');wl.classList.remove('hidden');wl.style.animation='none';void wl.offsetWidth;wl.style.animation='';setTimeout(()=>wl.classList.add('hidden'),3500);
  chime('done');say('Välkommen till sagolandet!');}
function exitWorld(){renderer.toneMapping=THREE.NoToneMapping;renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));mode='dress';keys.clear();joy.x=joy.y=0;$('#dress').classList.remove('playing');$('#worldui').classList.add('hidden');resize();chime('tab');}
$('#done').addEventListener('click',enterWorld);
const QUAL={hog:{name:'Hög',pr:1.5,sh:2048,grass:48000,bloom:true},mellan:{name:'Mellan',pr:1,sh:1024,grass:20000,bloom:false},lag:{name:'Låg',pr:.75,sh:0,grass:0,bloom:false}};
function loadQ(){try{const q=localStorage.getItem('kk3d-gfx');if(QUAL[q])return q;}catch(e){}return matchMedia('(pointer: coarse)').matches?'mellan':'hog';}
function applyQuality(q){W.q=q;const c=QUAL[q];const dpr=window.devicePixelRatio||1;renderer.setPixelRatio(q==='lag'?Math.min(dpr,1)*.75:Math.min(dpr,c.pr));
  renderer.shadowMap.enabled=c.sh>0;renderer.shadowMap.type=THREE.PCFShadowMap;W.sun.castShadow=c.sh>0;
  if(c.sh&&W.sun.shadow.mapSize.x!==c.sh){W.sun.shadow.mapSize.set(c.sh,c.sh);if(W.sun.shadow.map){W.sun.shadow.map.dispose();W.sun.shadow.map=null;}}
  W.grassGeo.instanceCount=c.grass;W.bloom.enabled=c.bloom;W.blob.visible=!c.sh;(W.blobs||[]).forEach(b=>b.visible=!c.sh);
  W.scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true);});
  $('#wq').textContent='⚙️ '+c.name;try{localStorage.setItem('kk3d-gfx',q);}catch(e){}resize();}
$('#wq').addEventListener('click',()=>{const order=['hog','mellan','lag'];applyQuality(order[(order.indexOf(W.q)+1)%3]);chime('tab');});
$('#wback').addEventListener('click',exitWorld);
$('#wsound').addEventListener('click',()=>{muted=!muted;$('#wsound').textContent=muted?'🔇':'🔊';$('#sound').textContent=muted?'🔇':'🔊';try{if(muted)speechSynthesis.cancel();}catch(e){}if(!muted)chime();});
if(matchMedia('(pointer: coarse)').matches)document.body.classList.add('touch');
window.addEventListener('touchstart',()=>document.body.classList.add('touch'),{once:true,passive:true});

/* ======================================================================
   ANIMATION
   ====================================================================== */
let showing=false;const clock=new THREE.Clock();let tt=0,nextBlink=2;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);tt+=dt;
  if($('#dress').classList.contains('hidden'))return;
  if(mode==='world'){if(W.built){updateWorld(dt);W.render();}return;}
  if(!dragging){rotY+=rotVel;rotVel*=.93;
    if(spinTarget!=null){rotY+=(spinTarget-rotY)*.12;if(Math.abs(spinTarget-rotY)<.002)spinTarget=null;}
    else if(!showing&&performance.now()-lastInteract>3500&&Math.abs(rotVel)<.001){const tgt=Math.round(rotY/(PI*2))*PI*2;rotY+=(tgt-rotY)*.025;}}
  let extra=0,jump=0;if(spinT<1){spinT=Math.min(1,spinT+dt/.9);const e=spinT<.5?2*spinT*spinT:1-Math.pow(-2*spinT+2,2)/2;extra=e*PI*2;jump=Math.sin(spinT*PI)*.6;}
  if(showing){rotY+=dt*.9;}
  charPivot.rotation.y=rotY+extra;
  const bob=showing?Math.abs(Math.sin(tt*3.2))*.35:Math.sin(tt*2.2)*.03;
  charPivot.position.y=jump+bob;
  if(popT<1){popT=Math.min(1,popT+dt/.45);const k=Math.sin(popT*PI);charPivot.scale.set(1+k*.07,1-k*.04,1+k*.07);}else charPivot.scale.set(1,1,1);
  charPivot.rotation.z=showing?Math.sin(tt*3.2)*.06:Math.sin(tt*1.1)*.012;
  blob.scale.setScalar(1-Math.min(.4,charPivot.position.y*.4));
  if(charObj){const r=charObj.userData.refs;
    if(tt>nextBlink){const k=tt-nextBlink;const f=k<.14?Math.max(.1,1-Math.sin(k/.14*PI)*.9):1;r.eyes.forEach(e=>e.scale.y=e.userData.sy*f);if(k>.14)nextBlink=tt+2.5+Math.random()*3;}
    r.spin.forEach(o=>o.rotation.y+=dt*2.5);r.glow.forEach((o,i)=>o.material.color.setHSL((tt*.7+i*.17)%1,1,.6));r.bob.forEach(o=>{o.position.y=o.userData.by+Math.sin(tt*1.6)*.1;o.rotation.z=Math.sin(tt*1.1)*.12;});r.flap.forEach(o=>o.rotation.y=o.userData.base-o.userData.sx*Math.sin(tt*5)*.28);}
  if(bgObj)bgObj.traverse(o=>{const u=o.userData;
    if(u.drift){o.position.x+=dt*u.drift;if(o.position.x>18)o.position.x=-18;}
    if(u.flag)o.rotation.y=Math.sin(tt*3+o.position.x)*.25;
    if(u.flicker!==undefined)o.scale.setScalar(.8+Math.sin(tt*9+u.flicker*1.7)*.25);
    if(u.fly!==undefined){const i=u.fly;o.position.set(Math.sin(tt*.5+i*2)*4.5+(i-1)*1.5,2+Math.sin(tt*1.3+i)*1.2,-1.5-Math.cos(tt*.4+i)*2);o.rotation.y=tt*.5+i;
      o.children.forEach(w=>{if(w.userData.wing)w.rotation.y=w.userData.wing*Math.sin(tt*14)*.9;});}
    if(u.fly2!==undefined){const i=u.fly2;o.position.x+=Math.sin(tt*.8+i)*.01;o.position.y+=Math.cos(tt*1.1+i*1.3)*.008;o.scale.setScalar(.7+Math.sin(tt*3+i)*.4);}
    if(u.twinkle!==undefined)o.scale.setScalar(.75+Math.sin(tt*2+u.twinkle)*.3);
    if(u.bob!==undefined){o.position.y+=Math.sin(tt*1.5+u.bob)*.006;o.rotation.y=Math.sin(tt+u.bob)*.6;}
    if(u.snow){const p=o.geometry.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*(.6+(i%5)*.12);if(y<0)y=14;p.setY(i,y);p.setX(i,p.getX(i)+Math.sin(tt+i)*.004);}p.needsUpdate=true;}
    if(u.sway!==undefined)o.rotation.z=Math.sin(tt*1.2+u.sway)*.12;
    if(u.swim!==undefined){const i=u.swim,a=tt*(.25+i*.04)+i*1.3,r=4+i*.9;o.position.set(Math.cos(a)*r,1.2+i*.5+Math.sin(tt+i)*.3,-4+Math.sin(a)*r*.5-i*.4);o.rotation.y=-a+(i%2?0:0)-PI/2;}
    if(u.rise){o.position.y+=dt*u.rise;if(o.position.y>11)o.position.y=0;o.position.x+=Math.sin(tt*2+o.position.y)*.003;}
    if(u.wave!==undefined){o.position.z=-8.3-u.wave*2.5+Math.sin(tt*1.2+u.wave)*.4;}
  });
  renderer.render(scene,camera);
}

const FULL={t:[0,2.45,0],d:13.5,el:.6,rot:.3};
function showStart(){
  for(const [g,el] of[['girl','#pg'],['boy','#pb']]){const st=load(g);const url=snapChar(st,FULL,300,400);$(el).innerHTML=`<img src="${url}" alt="">`;}
  document.querySelectorAll('.pick').forEach(b=>b.disabled=false);
  $('#dress').classList.add('hidden');$('#start').classList.remove('hidden');}
document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{
  S=load(b.dataset.g);curTab='outfit';rotY=0;rotVel=0;
  $('#start').classList.add('hidden');$('#dress').classList.remove('hidden');resize();
  rebuildChar();setBg(S.bg);drawTabs();drawItems();popT=0;setTimeout(burst,60);chime('done');
  say(S.gender==='girl'?'Prinsessan! Nu ska vi klä dig fin!':'Prinsen! Nu ska vi klä dig fin!');}));
(function twinkles(){const st=$('#start');for(let i=0;i<16;i++){const s=document.createElement('div');s.className='twinkle';s.textContent=i%3?'✨':'⭐';
  s.style.left=Math.random()*96+'%';s.style.top=Math.random()*96+'%';s.style.fontSize=(14+Math.random()*20)+'px';s.style.animationDelay=(Math.random()*2.4)+'s';st.appendChild(s);}})();
showStart();
animate();
window.__game={get S(){return S;},set:(k,v)=>{S[k]=v;changed(k!=='bg');drawItems();},tab:k=>{curTab=k;drawTabs();drawItems();},setRot:a=>{rotY=a;spinTarget=null;rotVel=0;lastInteract=performance.now()+1e6;}};
