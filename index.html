<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiskolan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0d0b2e;
    --bg2:#1c1259;
    --pink:#ff5ccf;
    --cyan:#3ee8ff;
    --lime:#8dff5a;
    --yellow:#ffd84a;
    --text:#ffffff;
    --soft:#c9c3ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;color:var(--text);
    font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;
    background:radial-gradient(ellipse at 50% 120%, #3b1d8f 0%, var(--bg2) 35%, var(--bg1) 75%)}

  #stars{position:fixed;inset:0;z-index:0}

  /* ---------- Planeter & rymdsaker ---------- */
  .planet{position:fixed;border-radius:50%;z-index:1}
  .p1{width:28vmin;height:28vmin;right:-3vw;top:4vh;
    background:radial-gradient(circle at 35% 30%, #ffb3ec, #ff5ccf 45%, #a42b97 100%);
    box-shadow:0 0 50px rgba(255,92,207,.55);animation:bob 7s ease-in-out infinite}
  .p1::after{content:"";position:absolute;left:-28%;right:-28%;top:42%;height:16%;border-radius:50%;
    border:5px solid rgba(255,216,74,.85);transform:rotate(-14deg);box-shadow:0 0 14px rgba(255,216,74,.6)}
  .p1 .spot{position:absolute;border-radius:50%;background:rgba(255,255,255,.18)}
  .p2{width:13vmin;height:13vmin;left:5vw;bottom:14vh;
    background:radial-gradient(circle at 35% 30%, #b8fff6, #3ee8ff 50%, #1a7fa8 100%);
    box-shadow:0 0 40px rgba(62,232,255,.5);animation:bob 9s ease-in-out infinite reverse}
  .p3{width:7vmin;height:7vmin;left:14vw;top:12vh;
    background:radial-gradient(circle at 35% 30%, #fff6b8, #ffd84a 55%, #c79a12 100%);
    box-shadow:0 0 30px rgba(255,216,74,.55);animation:bob 6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-14px)}}

  .ufo{position:fixed;z-index:2;top:22vh;left:-120px;width:90px;animation:fly 22s linear infinite}
  @keyframes fly{
    0%{transform:translate(0,0) rotate(-4deg)}
    25%{transform:translate(30vw,-4vh) rotate(4deg)}
    50%{transform:translate(60vw,3vh) rotate(-4deg)}
    75%{transform:translate(90vw,-3vh) rotate(4deg)}
    100%{transform:translate(calc(100vw + 240px),0) rotate(-4deg)}}

  main{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3.5vh;padding:3vh 4vw}

  /* ---------- Titel ---------- */
  .title{text-align:center;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.5)}}
  h1{font-weight:700;font-size:clamp(46px,9vw,118px);line-height:1;letter-spacing:.06em}
  h1 span{display:inline-block;animation:wave 2.8s ease-in-out infinite;
    -webkit-text-stroke:.07em #140f45;paint-order:stroke fill;
    text-shadow:
      0 .06em 0 #140f45,
      0 0 22px color-mix(in srgb, currentColor 45%, transparent)}
  @keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}

  /* ---------- Robot + pratbubbla ---------- */
  .host{display:flex;align-items:center;gap:14px;animation:pop .9s .2s cubic-bezier(.2,1.6,.4,1) both}
  .robot{width:clamp(70px,9vw,104px);animation:hover 3s ease-in-out infinite;cursor:pointer;
    filter:drop-shadow(0 0 16px rgba(62,232,255,.5))}
  @keyframes hover{50%{transform:translateY(-8px) rotate(3deg)}}
  .robot .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .robot.happy{animation:jump .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes jump{40%{transform:translateY(-26px) rotate(-10deg)}}
  .bubble{position:relative;background:#fff;color:#2a1f6b;font-weight:600;
    font-size:clamp(17px,2vw,24px);padding:.6em 1.1em;border-radius:22px;
    box-shadow:0 6px 0 rgba(0,0,0,.18),0 0 26px rgba(255,255,255,.25)}
  .bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;
    border:10px solid transparent;border-right:14px solid #fff;border-left:0}

  /* ---------- Kort ---------- */
  .cards{display:flex;gap:clamp(16px,2.6vw,38px);flex-wrap:wrap;justify-content:center}
  .card{--c:var(--cyan);position:relative;width:clamp(200px,23vw,280px);aspect-ratio:4/5;
    border:none;cursor:pointer;color:var(--text);outline:none;font-family:inherit;
    border-radius:34px;padding:0;
    background:linear-gradient(170deg, color-mix(in srgb,var(--c) 45%, #1c1259) 0%, #1c1259 70%);
    box-shadow:
      0 0 0 4px color-mix(in srgb,var(--c) 85%, white),
      0 10px 0 4px color-mix(in srgb,var(--c) 45%, black),
      0 0 40px color-mix(in srgb,var(--c) 45%, transparent);
    transition:transform .3s cubic-bezier(.2,1.6,.4,1), box-shadow .3s;
    animation:cardIn .8s cubic-bezier(.2,1.5,.4,1) both, float 4s ease-in-out infinite}
  .card:nth-child(1){animation-delay:.35s, 1.2s}
  .card:nth-child(2){animation-delay:.5s, 1.6s}
  .card:nth-child(3){animation-delay:.65s, 2s}
  @keyframes cardIn{from{opacity:0;transform:translateY(80px) scale(.7)}}
  @keyframes float{50%{transform:translateY(-8px)}}
  .card::before{content:"";position:absolute;inset:10px 10px auto 10px;height:38%;border-radius:26px 26px 60% 60%/26px 26px 30% 30%;
    background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);pointer-events:none}
  .card .inner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;padding:10% 8% 9%}
  .badge{width:64%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 40%, white), var(--c) 55%, color-mix(in srgb,var(--c) 55%, black));
    box-shadow:0 0 30px var(--c), inset 0 -8px 0 rgba(0,0,0,.18)}
  .badge::after{content:"";position:absolute;inset:-10px;border-radius:50%;
    border:3px dotted color-mix(in srgb,var(--c) 70%, white);animation:spin 12s linear infinite;opacity:.8}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge b{font-weight:700;font-size:clamp(30px,3.8vw,50px);color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .card h2{font-weight:700;font-size:clamp(22px,2.4vw,30px);text-align:center;line-height:1.1}
  .card p{font-weight:500;font-size:clamp(14px,1.3vw,17px);color:var(--soft);text-align:center;margin-top:.25em}
  .play{font-weight:700;font-size:clamp(16px,1.6vw,20px);color:#2a1f6b;background:#fff;
    padding:.45em 1.4em;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 50%, black);
    transition:transform .25s}

  .card:hover,.card.sel{transform:translateY(-14px) scale(1.06) rotate(-1.5deg);animation-play-state:paused;
    box-shadow:
      0 0 0 5px #fff,
      0 12px 0 5px color-mix(in srgb,var(--c) 45%, black),
      0 0 70px var(--c)}
  .card:nth-child(2):hover,.card:nth-child(2).sel{transform:translateY(-14px) scale(1.06) rotate(1.5deg)}
  .card:hover .play,.card.sel .play{transform:scale(1.1)}
  .card:active{transform:translateY(-4px) scale(.97)}
  .card.abc{--c:var(--pink)}
  .card.matte{--c:var(--cyan)}
  .card.ord{--c:var(--lime)}

  /* ---------- Ljudknapp ---------- */
  .sound{position:fixed;z-index:20;bottom:18px;right:18px;width:58px;height:58px;border-radius:50%;
    border:3px solid #fff;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer;
    box-shadow:0 0 18px rgba(255,255,255,.25);transition:transform .2s}
  .sound:hover{transform:scale(1.1)}

  /* ---------- "Snart klart"-ruta ---------- */
  .overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:rgba(13,11,46,.7);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.3s}
  .overlay.show{opacity:1;pointer-events:auto}
  .panel{--c:var(--cyan);text-align:center;padding:36px 50px 40px;border-radius:36px;max-width:90vw;
    background:linear-gradient(170deg, color-mix(in srgb,var(--c) 45%, #1c1259), #1c1259 75%);
    box-shadow:0 0 0 5px #fff, 0 12px 0 5px color-mix(in srgb,var(--c) 45%, black), 0 0 80px var(--c);
    transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  .overlay.show .panel{transform:none}
  .rocket{font-size:72px;display:inline-block;animation:launch 1.2s ease-in-out infinite}
  @keyframes launch{50%{transform:translateY(-12px) rotate(-8deg)}}
  .panel h3{font-weight:700;font-size:clamp(30px,4.5vw,46px);margin:.15em 0 .1em;text-shadow:0 0 18px var(--c)}
  .panel p{color:var(--soft);font-size:clamp(18px,2vw,22px);font-weight:500;margin-bottom:1.3em}
  .panel button{font-family:inherit;font-weight:700;font-size:20px;color:#2a1f6b;background:#fff;border:none;
    padding:.6em 1.8em;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 50%, black)}
  .panel button:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 50%, black)}

  /* ---------- Gnistor vid klick ---------- */
  .spark{position:fixed;z-index:60;pointer-events:none;font-size:22px;animation:sparkle .9s ease-out forwards}
  @keyframes sparkle{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(200deg);opacity:0}}

  @media (max-width:760px){
    main{justify-content:flex-start;padding-top:5vh;overflow-y:auto;overflow-x:hidden}
    .cards{gap:16px}
    .card{width:86vw;aspect-ratio:auto;min-height:0}
    .card::before{display:none}
    .card .inner{flex-direction:row;gap:16px;padding:16px 18px;justify-content:flex-start}
    .badge{width:84px;flex-shrink:0}
    .badge b{font-size:28px}
    .card .txt{flex:1;text-align:left}
    .card h2,.card p{text-align:left}
    .play{font-size:15px;padding:.4em 1em}
    .p1{width:34vmin;height:34vmin;right:-8vw;top:2vh}
    .ufo{display:none}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="planet p1"><i class="spot" style="width:22%;height:22%;left:22%;top:55%"></i><i class="spot" style="width:12%;height:12%;left:60%;top:24%"></i></div>
<div class="planet p2"></div>
<div class="planet p3"></div>

<svg class="ufo" viewBox="0 0 100 60" aria-hidden="true">
  <ellipse cx="50" cy="26" rx="18" ry="16" fill="#b8fff6" opacity=".85"/>
  <circle cx="50" cy="24" r="6" fill="#8dff5a"/><circle cx="48" cy="22" r="1.6" fill="#1c1259"/><circle cx="53" cy="22" r="1.6" fill="#1c1259"/>
  <ellipse cx="50" cy="36" rx="44" ry="11" fill="#c9c3ff"/>
  <ellipse cx="50" cy="33" rx="44" ry="7" fill="#e9e6ff"/>
  <circle cx="22" cy="38" r="3" fill="#ffd84a"/><circle cx="38" cy="41" r="3" fill="#ff5ccf"/>
  <circle cx="62" cy="41" r="3" fill="#3ee8ff"/><circle cx="78" cy="38" r="3" fill="#8dff5a"/>
</svg>

<main>
  <div class="title">
    <h1 id="title"></h1>
  </div>

  <div class="host">
    <svg class="robot" id="robot" viewBox="0 0 100 110" aria-label="Robot">
      <line x1="50" y1="6" x2="50" y2="20" stroke="#c9c3ff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="50" cy="7" r="6" fill="#ffd84a"><animate attributeName="opacity" values="1;.4;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <rect x="14" y="20" width="72" height="56" rx="22" fill="#e9e6ff"/>
      <rect x="22" y="29" width="56" height="36" rx="16" fill="#1c1259"/>
      <ellipse class="eye" cx="38" cy="45" rx="7" ry="8" fill="#3ee8ff"/>
      <ellipse class="eye" cx="62" cy="45" rx="7" ry="8" fill="#3ee8ff"/>
      <path d="M40 57 Q50 64 60 57" stroke="#3ee8ff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="28" cy="58" r="3.5" fill="#ff5ccf" opacity=".7"/><circle cx="72" cy="58" r="3.5" fill="#ff5ccf" opacity=".7"/>
      <rect x="6" y="40" width="10" height="18" rx="5" fill="#c9c3ff"/>
      <rect x="84" y="40" width="10" height="18" rx="5" fill="#c9c3ff"/>
      <rect x="32" y="78" width="36" height="24" rx="12" fill="#c9c3ff"/>
      <circle cx="50" cy="90" r="5" fill="#ff5ccf"/>
    </svg>
    <div class="bubble" id="bubble">Hej! Vad vill du lära dig idag?</div>
  </div>

  <div class="cards" id="cards">
    <button class="card abc" data-name="ABC Skolan" data-say="Bokstäver är superkul!">
      <div class="inner">
        <div class="badge"><b>ABC</b></div>
        <div class="txt">
          <h2>ABC Skolan</h2>
          <p>Lär dig bokstäverna</p>
        </div>
        <div class="play">Spela!</div>
      </div>
    </button>

    <button class="card matte" data-name="Matteskolan" data-say="Ska vi räkna tillsammans?">
      <div class="inner">
        <div class="badge"><b>1+2</b></div>
        <div class="txt">
          <h2>Matteskolan</h2>
          <p>Räkna med siffror</p>
        </div>
        <div class="play">Spela!</div>
      </div>
    </button>

    <button class="card ord" data-name="Ord skolan" data-say="Vi bygger ord av bokstäver!">
      <div class="inner">
        <div class="badge"><b>ORD</b></div>
        <div class="txt">
          <h2>Ord skolan</h2>
          <p>Läs och bygg ord</p>
        </div>
        <div class="play">Spela!</div>
      </div>
    </button>
  </div>
</main>

<button class="sound" id="sound" aria-label="Ljud på/av">🔊</button>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <div class="rocket">🚀</div>
    <h3 id="panelTitle">ABC Skolan</h3>
    <p>Snart klart! Raketen bygger fortfarande.</p>
    <button id="back">Tillbaka</button>
  </div>
</div>

<script>
/* ---------- Titel med färgglada bokstäver ---------- */
const colors = ['#ff5ccf','#3ee8ff','#8dff5a','#ffd84a'];
const titleEl = document.getElementById('title');
'MULTISKOLAN'.split('').forEach((ch,i)=>{
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.color = colors[i % colors.length];
  s.style.animationDelay = (i*0.12)+'s';
  titleEl.appendChild(s);
});

/* ---------- Mjukt stjärnfält ---------- */
const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
let W, H, stars = [], speed = 1, targetSpeed = 1;
function resize(){ W = cv.width = innerWidth*devicePixelRatio; H = cv.height = innerHeight*devicePixelRatio; }
addEventListener('resize', resize); resize();
const starColors = ['#ffffff','#ffffff','#ffd84a','#3ee8ff','#ff5ccf'];
for (let i=0;i<220;i++) stars.push({
  x:Math.random(), y:Math.random(), r:Math.random()*1.8+.5,
  v:Math.random()*.00025+.00008, t:Math.random()*Math.PI*2,
  c:starColors[Math.floor(Math.random()*starColors.length)]
});
function draw(){
  ctx.clearRect(0,0,W,H);
  for (const s of stars){
    s.x -= s.v*speed; s.t += .04;
    if (s.x < 0) { s.x = 1; s.y = Math.random(); }
    const a = .55 + Math.sin(s.t)*.45;
    ctx.globalAlpha = a; ctx.fillStyle = s.c;
    const r = s.r*devicePixelRatio;
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, r, 0, Math.PI*2); ctx.fill();
    if (speed > 3){ ctx.globalAlpha = a*.5; ctx.fillRect(s.x*W, s.y*H - r/2, s.v*speed*W*6, r); }
  }
  ctx.globalAlpha = 1;
  speed += (targetSpeed - speed)*.06;
  requestAnimationFrame(draw);
}
draw();

/* ---------- Mjuka ljud (inga ljudfiler) ---------- */
let soundOn = true, ac;
function tone(freq, dur=.15, type='sine', vol=.08, when=0){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const notes = [523, 659, 784]; // C, E, G
function chime(){ tone(784,.12,'sine',.07); tone(1047,.18,'sine',.06,.08); }
function fanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.08,i*.1)); }

const soundBtn = document.getElementById('sound');
soundBtn.onclick = ()=>{ soundOn=!soundOn; soundBtn.textContent = soundOn?'🔊':'🔇'; chime(); };

/* ---------- Robot ---------- */
const robot = document.getElementById('robot'), bubble = document.getElementById('bubble');
const defaultSay = 'Hej! Vad vill du lära dig idag?';
function say(text){ bubble.textContent = text; }
function happy(){ robot.classList.remove('happy'); void robot.offsetWidth; robot.classList.add('happy'); }
robot.addEventListener('click', ()=>{
  const lines = ['Pip pip! Jag heter Bip!','Tryck på ett kort så kör vi!','Du är jätteduktig!','Rymden är full av bokstäver!'];
  say(lines[Math.floor(Math.random()*lines.length)]); happy(); fanfare();
});

/* ---------- Gnistor ---------- */
function sparks(x, y){
  const sym = ['⭐','✨','💫','🌟'];
  for (let i=0;i<10;i++){
    const s = document.createElement('div');
    s.className = 'spark'; s.textContent = sym[i%sym.length];
    s.style.left = x+'px'; s.style.top = y+'px';
    const a = Math.random()*Math.PI*2, d = 60 + Math.random()*80;
    s.style.setProperty('--dx', Math.cos(a)*d+'px');
    s.style.setProperty('--dy', Math.sin(a)*d+'px');
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 950);
  }
}

/* ---------- Menyval ---------- */
const cards = [...document.querySelectorAll('.card')];
const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
let sel = -1;
function select(i, sound=true){
  sel = (i+cards.length)%cards.length;
  cards.forEach((c,j)=>c.classList.toggle('sel', j===sel));
  say(cards[sel].dataset.say);
  if (sound) tone(notes[sel], .18, 'sine', .07);
}
cards.forEach((c,i)=>{
  c.addEventListener('mouseenter', ()=>select(i));
  c.addEventListener('focus', ()=>select(i,false));
  c.addEventListener('click', e=>{
    const r = c.getBoundingClientRect();
    sparks(e.clientX || r.left+r.width/2, e.clientY || r.top+r.height/2);
    launch(i);
  });
});
cards.forEach(c=>c.addEventListener('mouseleave', ()=>{ c.classList.remove('sel'); say(defaultSay); }));

function launch(i){
  const c = cards[i];
  document.getElementById('panelTitle').textContent = c.dataset.name;
  panel.style.setProperty('--c', getComputedStyle(c).getPropertyValue('--c'));
  fanfare(); happy();
  targetSpeed = 25;
  setTimeout(()=>overlay.classList.add('show'), 300);
}
function closeOverlay(){
  overlay.classList.remove('show'); targetSpeed = 1; chime(); say(defaultSay);
}
document.getElementById('back').onclick = closeOverlay;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeOverlay(); });

addEventListener('keydown', e=>{
  if (overlay.classList.contains('show')){
    if (['Escape','Enter',' ','Backspace'].includes(e.key)) { e.preventDefault(); closeOverlay(); }
    return;
  }
  if (e.key==='ArrowRight'||e.key==='d') select(sel+1);
  else if (e.key==='ArrowLeft'||e.key==='a') select(sel<0?0:sel-1);
  else if ((e.key==='Enter'||e.key===' ') && sel>=0){ e.preventDefault(); launch(sel); }
});
</script>
</body>
</html>
