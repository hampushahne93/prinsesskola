<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kungliga klädskåpet</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#5a2d82;--gold:#ffcf3a;--gold-d:#d99a12}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#ffe3f4 0%,#efe2ff 55%,#dff0ff 100%);user-select:none;-webkit-user-select:none}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .hidden{display:none!important}

  /* START */
  #start{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:20px;position:relative}
  #start h1{margin:0;text-align:center;font-size:clamp(34px,7vw,64px);line-height:1;font-weight:700;
    background:linear-gradient(180deg,#ffd75a,#f0a31b);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #9a5bd6) drop-shadow(0 6px 10px rgba(120,60,180,.25))}
  .crownTop{font-size:clamp(40px,8vw,70px);animation:float 3s ease-in-out infinite}
  .sub{margin:0;font-size:clamp(20px,4vw,30px);font-weight:600}
  .choose{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center}
  .pick{width:min(40vw,240px);background:#fff;border-radius:32px;padding:12px 12px 14px;
    box-shadow:0 8px 0 #e4c8f5,0 14px 30px rgba(120,60,180,.18);transition:transform .15s;display:flex;flex-direction:column;align-items:center}
  .pick:active{transform:scale(.95)}
  .pick .pv{width:100%;height:min(40vh,300px);display:grid;place-items:center}
  .pick img{width:100%;height:100%;object-fit:contain}
  .pick span{font-size:clamp(24px,4.5vw,36px);font-weight:700;margin-top:4px}
  .pick[data-g="girl"] span{color:#ff5aa8}
  .pick[data-g="boy"] span{color:#4a6fe0}
  .pick:disabled{opacity:.6}
  .twinkle{position:absolute;pointer-events:none;animation:tw 2.4s ease-in-out infinite;opacity:.7}
  .loading{font-size:40px;animation:spin 1.4s linear infinite}
  #err{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-size:24px;background:#fff0fa;z-index:50}

  /* DRESS */
  #dress{height:100dvh;display:flex;flex-direction:column}
  .stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 6px 20px rgba(90,45,130,.15);background:#cfe9ff}
  #c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c3d:active{cursor:grabbing}
  .fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .fx span{position:absolute;animation:burst .9s ease-out forwards}
  .topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .topbar .spacer{flex:1;pointer-events:none}
  .round{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);font-size:28px;
    box-shadow:0 4px 0 rgba(150,100,190,.35);display:grid;place-items:center;transition:transform .12s}
  .round:active,.pill:active{transform:scale(.9)}
  .pill{height:56px;padding:0 22px;border-radius:30px;font-size:26px;font-weight:700;color:#7a3f00;
    background:linear-gradient(180deg,#ffe27a,#ffbf2e);box-shadow:0 5px 0 #d08a10,0 8px 18px rgba(200,130,0,.3)}
  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:8px 18px;border-radius:20px;
    font-size:20px;font-weight:600;box-shadow:0 3px 0 rgba(150,100,190,.3);pointer-events:none;transition:opacity .6s;animation:nudge 1.6s ease-in-out infinite;white-space:nowrap}

  .panel{flex:0 0 auto;height:46%;display:flex;flex-direction:column;padding:10px 10px 12px;gap:8px;min-height:0}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;flex:0 0 auto;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;width:62px;height:62px;border-radius:20px;background:#fff;font-size:32px;display:grid;place-items:center;
    box-shadow:0 4px 0 #ead4f7;transition:transform .12s,background .2s}
  .tab svg{width:38px;height:38px}
  .tab.on{background:linear-gradient(180deg,#ffb3dc,#ff86c4);box-shadow:0 4px 0 #e0559c;transform:translateY(-3px) scale(1.06)}
  .items{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,100px);grid-auto-rows:100px;gap:10px;padding:4px;align-content:start;justify-content:center}
  .item{width:100%;height:100%;border-radius:22px;background:radial-gradient(circle at 50% 40%,#fff 0%,#fdf0ff 100%);border:4px solid #fff;box-shadow:0 4px 0 #ead4f7;overflow:hidden;position:relative;transition:transform .12s;padding:0}
  .item img{width:100%;height:100%;display:block;object-fit:cover}
  .item .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;opacity:.35;animation:tw 1.2s ease-in-out infinite}
  .item:active{transform:scale(.92)}
  .item.on{border-color:var(--gold);box-shadow:0 0 0 3px #fff3b0,0 4px 0 var(--gold-d),0 0 18px rgba(255,200,40,.7)}
  .item.on::after{content:'⭐';position:absolute;top:2px;right:4px;font-size:18px}
  .item .none{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:.55}
  .colors{flex:0 0 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:4px 4px 6px}
  .colors::-webkit-scrollbar{display:none}
  .col{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(120,60,180,.25);transition:transform .12s}
  .col.on{transform:scale(1.18);box-shadow:0 0 0 3px var(--gold),0 3px 0 rgba(120,60,180,.25)}
  .col:active{transform:scale(.9)}

  /* SHOW MODE */
  .showui{position:absolute;inset:0;pointer-events:none}
  .showtitle{position:absolute;top:4%;left:0;right:0;text-align:center;font-size:clamp(30px,6vw,56px);font-weight:700;color:#fff;
    text-shadow:0 3px 0 #b0459a,0 0 18px rgba(255,120,200,.9);padding:0 16px;animation:pop .6s ease-out}
  .confetti{position:absolute;inset:0;overflow:hidden}
  .confetti span{position:absolute;top:-10%;animation:fall linear forwards}
  #back{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);pointer-events:auto}
  #back:active{transform:translateX(-50%) scale(.92)}
  #dress.showing .panel,#dress.showing .topbar,#dress.showing .hint{display:none}
  #dress.showing .stage{border-radius:0}

  @media (min-aspect-ratio: 1/1){
    #dress{flex-direction:row}
    .stage{border-radius:0 28px 28px 0}
    .panel{height:auto;width:min(44vw,430px);padding:12px}
    .items{grid-template-columns:repeat(auto-fill,112px);grid-auto-rows:112px}
    .tabs{flex-wrap:wrap;justify-content:center;overflow:visible;-webkit-mask-image:none;mask-image:none}
  }
  @keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  @keyframes tw{0%,100%{transform:scale(.7);opacity:.3}50%{transform:scale(1.05);opacity:.9}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes nudge{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 10px))}}
  @keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(40deg);opacity:0}}
  @keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js"}}</script>
</head>
<body>

<div id="start">
  <div class="crownTop">👑</div>
  <h1>Kungliga<br>klädskåpet</h1>
  <p class="sub">Vem vill du vara?</p>
  <div class="choose">
    <button class="pick" data-g="girl" disabled><div class="pv" id="pg"><div class="loading">✨</div></div><span>Tjej</span></button>
    <button class="pick" data-g="boy" disabled><div class="pv" id="pb"><div class="loading">✨</div></div><span>Kille</span></button>
  </div>
</div>

<div id="dress" class="hidden">
  <div class="stage" id="stage">
    <canvas id="c3d"></canvas>
    <div class="fx" id="fx"></div>
    <div class="hint" id="hint">👆 Dra för att snurra!</div>
    <div class="topbar">
      <button id="home" class="round" aria-label="Börja om">🏠</button>
      <div class="spacer"></div>
      <button id="sound" class="round" aria-label="Ljud">🔊</button>
      <button id="magic" class="round" aria-label="Trolla">🎲</button>
      <button id="done" class="pill">✨ Klar!</button>
    </div>
    <div class="showui hidden" id="showui">
      <div class="confetti" id="confetti"></div>
      <div class="showtitle" id="showtitle"></div>
      <button id="back" class="pill">👗 Klä om</button>
    </div>
  </div>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
    <div class="colors" id="colors"></div>
  </div>
</div>

<div id="err" class="hidden"></div>

<script>
  // Visar ett vänligt meddelande om 3D-motorn inte går att ladda
  setTimeout(function(){ if(!window.__ok){ var e=document.getElementById('err'); e.classList.remove('hidden');
    e.innerHTML='👑<br>Slottet laddar inte just nu.<br><small>Kolla internet och ladda om sidan.</small>'; } }, 12000);
</script>

<script type="module">
import * as THREE from 'three';

/* ======================================================================
   HJÄLPARE
   ====================================================================== */
const $ = s => document.querySelector(s);
const PI = Math.PI;
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const G = '#ffcf3a', GD = '#d99a12';
function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function shade(h,a){const c=hex2rgb(h);const t=a<0?0:255,p=Math.abs(a);
  return '#'+c.map(v=>Math.round(v+(t-v)*p).toString(16).padStart(2,'0')).join('');}
function rng(seed){return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}

/* Tecknad (toon) ljussättning */
const gradMap = (()=>{const d=new Uint8Array([120,120,120,255, 200,200,200,255, 255,255,255,255]);
  const t=new THREE.DataTexture(d,3,1);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const MC = new Map();
function M(color,o={}){const k='t'+color+JSON.stringify(o);let m=MC.get(k);
  if(!m){m=new THREE.MeshToonMaterial({color,gradientMap:gradMap,...o});MC.set(k,m);}return m;}
function MB(color,o={}){const k='b'+color+JSON.stringify(o);let m=MC.get(k);
  if(!m){m=new THREE.MeshBasicMaterial({color,...o});MC.set(k,m);}return m;}
const DS = THREE.DoubleSide;
const gold = () => M(G,{emissive:'#7a5200',emissiveIntensity:.35});
const goldDS = () => M(G,{emissive:'#7a5200',emissiveIntensity:.35,side:DS});
const silver = () => M('#e8eeff',{emissive:'#5a6a99',emissiveIntensity:.2});
const gem = c => M(c,{emissive:c,emissiveIntensity:.35});

function mk(geo,m,p,r,s){const o=new THREE.Mesh(geo,m);if(p)o.position.set(p[0],p[1],p[2]);if(r)o.rotation.set(r[0],r[1],r[2]);
  if(s!=null){if(typeof s==='number')o.scale.setScalar(s);else o.scale.set(s[0],s[1],s[2]);}return o;}
const sph = (r,m,p,s,seg=22) => mk(new THREE.SphereGeometry(r,seg,Math.max(10,seg*.66|0)),m,p,null,s);
function limb(a,b,r,m,cap=true){const d=b.clone().sub(a);const len=d.length();
  const g=cap?new THREE.CapsuleGeometry(r,len,6,16):new THREE.CylinderGeometry(r,r,len,18);
  const o=new THREE.Mesh(g,m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return o;}
function cone(a,b,ra,rb,m,open=false){const d=b.clone().sub(a);const len=d.length();
  const o=new THREE.Mesh(new THREE.CylinderGeometry(rb,ra,len,24,1,open),m);o.position.copy(a).add(b).multiplyScalar(.5);
  o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return o;}
function ring(center,dir,R,tube,m,arc=PI*2){const o=new THREE.Mesh(new THREE.TorusGeometry(R,tube,10,40,arc),m);
  o.position.copy(center);o.quaternion.setFromUnitVectors(V(0,0,1),dir.clone().normalize());return o;}
function cyl(rt,rb,h,m,p,o={}){const g=new THREE.CylinderGeometry(rt,rb,h,o.seg||40,o.hs||1,!!o.open,o.ts||0,o.tl||PI*2);
  if(o.pleat)pleat(g,...o.pleat);return mk(g,m,p,o.r,o.s);}
function lathe(pts,m,o={}){const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),o.seg||72,o.ps||0,o.pl||PI*2);
  if(o.pleat)pleat(g,...o.pleat);return mk(g,m,o.p,null,o.s);}
/* veck: radien vågas mer ju längre ner */
function pleat(g,n,amp,yTop,yBot,ph=0){const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const f=Math.min(1,Math.max(0,(yTop-y)/(yTop-yBot)));const k=1+amp*f*Math.sin(Math.atan2(x,z)*n+ph);p.setXYZ(i,x*k,y,z*k);}
  p.needsUpdate=true;g.computeVertexNormals();}
function radiusAt(pts,y){for(let i=0;i<pts.length-1;i++){const [r0,y0]=pts[i],[r1,y1]=pts[i+1];
  if((y<=y0&&y>=y1)||(y>=y0&&y<=y1)){const t=(y-y0)/((y1-y0)||1);return r0+(r1-r0)*t;}}return pts[pts.length-1][0];}
/* utspridda saker på en kjol-yta */
function onSkirt(pts,n,seed,make,phiMin=-PI,phiMax=PI,yMin,yMax,out=.03){const R=rng(seed);const arr=[];
  const ys=pts.map(p=>p[1]);yMin=yMin??Math.min(...ys)+.08;yMax=yMax??Math.max(...ys)-.15;
  for(let i=0;i<n;i++){const y=yMin+R()*(yMax-yMin),ph=phiMin+R()*(phiMax-phiMin);const r=radiusAt(pts,y)*(1+out)+.02;
    const o=make(i);o.position.set(r*Math.sin(ph),y,r*Math.cos(ph));o.lookAt(o.position.x*2,y,o.position.z*2);arr.push(o);}return arr;}
function starShape(r){const s=new THREE.Shape();for(let i=0;i<10;i++){const a=PI/2+i*PI/5,rr=i%2?r*.45:r;
  const x=rr*Math.cos(a),y=rr*Math.sin(a);i?s.lineTo(x,y):s.moveTo(x,y);}s.closePath();return s;}
const extr=(shape,d)=>{const g=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:d*.4,bevelSize:d*.4,bevelSegments:2,curveSegments:10});g.center();return g;};
const starGeo=(r,d=.05)=>extr(starShape(r),d);
function heartGeo(r,d=.05){const s=new THREE.Shape();s.moveTo(0,-r);s.bezierCurveTo(-r*1.3,-r*.1,-r*.9,r*1.05,0,r*.4);
  s.bezierCurveTo(r*.9,r*1.05,r*1.3,-r*.1,0,-r);return extr(s,d);}
function flower(col,r=.07){const g=new THREE.Group();for(let i=0;i<5;i++){const a=i*PI*2/5;g.add(sph(r,M(col),[Math.cos(a)*r*1.1,Math.sin(a)*r*1.1,0],[1,1,.5],12));}
  g.add(sph(r*.75,M('#ffd84a'),[0,0,r*.25],[1,1,.6],12));return g;}
function snowflake(r,m){const g=new THREE.Group();for(let i=0;i<3;i++)g.add(mk(new THREE.BoxGeometry(r*2,r*.16,r*.1),m,[0,0,0],[0,0,i*PI/3]));
  for(let i=0;i<6;i++){const a=i*PI/3;for(const s of[-1,1])g.add(mk(new THREE.BoxGeometry(r*.45,r*.1,r*.08),m,[Math.cos(a)*r*.62+Math.cos(a+s*PI/4)*r*.15,Math.sin(a)*r*.62+Math.sin(a+s*PI/4)*r*.15,0],[0,0,a+s*PI/4]));}return g;}
function butterfly(c1,c2,s=1){const g=new THREE.Group();for(const sx of[-1,1]){g.add(mk(new THREE.CircleGeometry(.14*s,20),M(c1,{side:DS}),[.13*s*sx,.07*s,0],[0,0,sx*.3],[1,1.25,1]));
  g.add(mk(new THREE.CircleGeometry(.09*s,16),M(c2,{side:DS}),[.1*s*sx,-.1*s,.002],[0,0,-sx*.3]));}g.add(limb(V(0,-.15*s,.01),V(0,.15*s,.01),.025*s,M('#5a2d82')));return g;}
function rose(c,r=.07){const g=new THREE.Group();for(let i=0;i<6;i++){const a=i/6*PI*2;g.add(sph(r,M(c),[Math.cos(a)*r*.8,Math.sin(a)*r*.8,0],[1,1,.6],10));}
  g.add(sph(r*.9,M(shade(c,-.25)),[0,0,r*.4],null,10));return g;}
const moon=r=>mk(new THREE.TorusGeometry(r,r*.35,8,16,PI*1.2),gold());

/* ======================================================================
   PALETTER
   ====================================================================== */
const DRESS=[['#ff8fc8','Rosa'],['#ffc2e2','Ljusrosa'],['#3fd0c9','Turkos'],['#ffb894','Persika'],['#b98cff','Lila'],['#7cc4ff','Ljusblå'],['#ffcf3a','Guld'],['#ff5b6e','Röd'],['#f6f1ff','Vit'],['#5fd3a0','Grön'],['#4a5fe0','Kungsblå'],['#ff9f4a','Orange'],['#3a2f6a','Midnattsblå']];
const HAIRP=[['#ffd66b','Blont'],['#c98a4b','Ljusbrunt'],['#7a4a2a','Brunt'],['#2e211c','Svart'],['#d9582b','Rött'],['#ff9fd0','Rosa'],['#b48cff','Lila'],['#8fd3ff','Blått'],['#f4f4f4','Vitt']];
const CAPEP=[['#c8203f','Kungaröd'],...DRESS];

/* ======================================================================
   KROPP OCH ANSIKTE
   ====================================================================== */
const HY=3.75, HC=V(0,HY,0);
function facePt(x,y,d=0){const v=y/.95;const z=.94*Math.sqrt(Math.max(0,1-x*x-v*v));return V(x,HY+y,z+d);}
function onFace(o,x,y,d=0){const p=facePt(x,y,d);o.position.copy(p);const n=V(x,y/.95,p.z/.94).normalize();o.lookAt(p.clone().add(n));return o;}
const ARM=sx=>[V(.46*sx,2.42,0),V(.76*sx,1.62,.06)];
const HAND=sx=>V(.78*sx,1.5,.07);

function buildBody(st,add,refs){
  const sk=M(st.skin);
  for(const sx of[-1,1])add(limb(V(.2*sx,.2,0),V(.2*sx,1.55,0),.15,sk));
  add(sph(.37,sk,[0,1.62,0],[1,.6,.8]));
  add(cyl(.40,.34,1.0,sk,[0,2.05,0],{s:[1,1,.78]}));
  for(const sx of[-1,1]){const [a,b]=ARM(sx);add(sph(.17,sk,[.42*sx,2.42,0]));add(limb(a,b,.11,sk));const h=HAND(sx);add(sph(.15,sk,[h.x,h.y,h.z],[1,1.1,1]));}
  add(cyl(.15,.16,.6,sk,[0,2.72,0]));
  add(sph(1,sk,[0,HY,0],[1,.95,.94],40));
  for(const sx of[-1,1])add(sph(.18,sk,[.97*sx,HY-.05,0],[.6,1,1]));
  // ansikte
  const eyeM=M('#2d2140');
  for(const sx of[-1,1]){
    const e=onFace(sph(.19,eyeM,null,null),.36*sx,-.02,-.06);e.scale.set(.82,1.1,.42);add(e);refs.eyes.push(e);
    const h1=onFace(sph(.065,MB('#ffffff')),.36*sx+.06,.07,.03);add(h1);refs.eyes.push(h1);
    const h2=onFace(sph(.03,MB('#ffffff')),.36*sx-.06,-.1,.03);add(h2);refs.eyes.push(h2);
    const br=onFace(mk(new THREE.TorusGeometry(.14,.022,8,16,PI*.6),M('#6a4a3a')),.36*sx,.3,.01);br.rotateZ(PI*.2);add(br);
    const ch=onFace(mk(new THREE.CircleGeometry(.15,24),MB('#ff6f9f',{transparent:true,opacity:.35})),.56*sx,-.24,.012);add(ch);
    if(st.gender==='girl'){for(let i=0;i<3;i++){const l=onFace(mk(new THREE.CapsuleGeometry(.014,.09,4,6),eyeM),(.36+.13+i*.025)*sx,.1+i*.05,.02);l.rotateZ(sx*(-.9+i*.25));add(l);}}
  }
  add(onFace(sph(.06,M(shade(st.skin,-.08))),0,-.16,.0));
  const mo=onFace(mk(new THREE.TorusGeometry(.15,.04,8,20,PI),M('#c2456a')),0,-.3,.01);mo.rotateZ(PI);add(mo);
  add(onFace(mk(new THREE.CircleGeometry(.13,20,PI,PI),MB('#e0607e')),0,-.31,.005));
}

/* ======================================================================
   HÅR
   ====================================================================== */
function hairCap(m,add,back=.6){

const bodice=(c,top=2.44,bot=1.62)=>cyl(.44,.39,top-bot,M(c),[0,(top+bot)/2,0],{s:[1,1,.82]});
const puffs=(c,add,r=.22)=>{for(const sx of[-1,1])add(sph(r,M(c),[.47*sx,2.42,0],[1,.9,1]));};
const skirtM=c=>M(c,{side:DS});
function bow(c,add,p,s=1){for(const sx of[-1,1])add(cone(V(p[0],p[1],p[2]),V(p[0]+.18*s*sx,p[1]+.05*s,p[2]),.02,.09*s,M(c)));add(sph(.05*s,M(c),p));}
function longSleeves(c,add,r=.14,cuff=G){for(const sx of[-1,1]){const [a,b]=ARM(sx);add(limb(a,b,r,M(c)));add(sph(r+.03,M(c),[a.x,a.y,a.z]));
  if(cuff)add(ring(b.clone().lerp(a,.04),b.clone().sub(a),r+.01,.04,cuff===G?gold():M(cuff)));}}
const pants=(pc,add,bot=.2)=>{for(const sx of[-1,1])add(limb(V(.2*sx,bot,0),V(.2*sx,1.62,0),.2,M(pc),false));add(cyl(.42,.4,.36,M(pc),[0,1.62,0],{s:[1,1,.82]}));};
const jacket=(c,add,bot=1.48)=>{add(cyl(.47,.44,2.55-bot,M(c),[0,(2.55+bot)/2,0],{s:[1,1,.84]}));};
const epaulettes=add=>{for(const sx of[-1,1]){add(sph(.2,gold(),[.44*sx,2.52,0],[1,.32,1]));for(let i=0;i<7;i++){const a=i/7*PI*2;add(limb(V(.44*sx+.18*Math.cos(a),2.5,.18*Math.sin(a)),V(.44*sx+.2*Math.cos(a),2.36,.2*Math.sin(a)),.018,gold(),false));}}};
const FRONT=.385; // jackans framsida (z)
function jacketZ(x,y){const r=.44+(.47-.44)*Math.min(1,Math.max(0,(y-1.48)/(2.55-1.48)));return .84*Math.sqrt(Math.max(0,r*r-x*x));}
function onJacket(pts,r,m,off=.012){const c=new THREE.CatmullRomCurve3(pts.map(([x,y])=>V(x,y,jacketZ(x,y)+off)));return mk(new THREE.TubeGeometry(c,32,r,8),m);}

let showing=false;const clock=new THREE.Clock();let tt=0,nextBlink=2;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);tt+=dt;
  if($('#dress').classList.contains('hidden'))return;
  if(!dragging){rotY+=rotVel;rotVel*=.93;
    if(spinTarget!=null){rotY+=(spinTarget-rotY)*.12;if(Math.abs(spinTarget-rotY)<.002)spinTarget=null;}
    else if(!showing&&performance.now()-lastInteract>3500&&Math.abs(rotVel)<.001){const tgt=Math.round(rotY/(PI*2))*PI*2;rotY+=(tgt-rotY)*.025;}}
  let extra=0,jump=0;if(spinT<1){spinT=Math.min(1,spinT+dt/.9);const e=spinT<.5?2*spinT*spinT:1-Math.pow(-2*spinT+2,2)/2;extra=e*PI*2;jump=Math.sin(spinT*PI)*.6;}
  if(showing){rotY+=dt*.9;}
  charPivot.rotation.y=rotY+extra;
  const bob=showing?Math.abs(Math.sin(tt*3.2))*.35:Math.sin(tt*2.2)*.03;
  charPivot.position.y=jump+bob;
  if(popT<1){popT=Math.min(1,popT+dt/.45);const k=Math.sin(popT*PI);charPivot.scale.set(1+k*.07,1-k*.04,1+k*.07);}else charPivot.scale.set(1,1,1);
  charPivot.rotation.z=showing?Math.sin(tt*3.2)*.06:Math.sin(tt*1.1)*.012;
  blob.scale.setScalar(1-Math.min(.4,charPivot.position.y*.4));
  if(charObj){const r=charObj.userData.refs;
    if(tt>nextBlink){const k=tt-nextBlink;const f=k<.14?Math.max(.1,1-Math.sin(k/.14*PI)*.9):1;r.eyes.forEach(e=>e.scale.y=e.userData.sy*f);if(k>.14)nextBlink=tt+2.5+Math.random()*3;}
    r.spin.forEach(o=>o.rotation.y+=dt*2.5);r.glow.forEach((o,i)=>o.material.color.setHSL((tt*.7+i*.17)%1,1,.6));r.bob.forEach(o=>{o.position.y=o.userData.by+Math.sin(tt*1.6)*.1;o.rotation.z=Math.sin(tt*1.1)*.12;});r.flap.forEach(o=>o.rotation.y=o.userData.base-o.userData.sx*Math.sin(tt*5)*.28);}
  if(bgObj)bgObj.traverse(o=>{const u=o.userData;
    if(u.drift){o.position.x+=dt*u.drift;if(o.position.x>18)o.position.x=-18;}
    if(u.flag)o.rotation.y=Math.sin(tt*3+o.position.x)*.25;
    if(u.flicker!==undefined)o.scale.setScalar(.8+Math.sin(tt*9+u.flicker*1.7)*.25);
    if(u.fly!==undefined){const i=u.fly;o.position.set(Math.sin(tt*.5+i*2)*4.5+(i-1)*1.5,2+Math.sin(tt*1.3+i)*1.2,-1.5-Math.cos(tt*.4+i)*2);o.rotation.y=tt*.5+i;
      o.children.forEach(w=>{if(w.userData.wing)w.rotation.y=w.userData.wing*Math.sin(tt*14)*.9;});}
    if(u.fly2!==undefined){const i=u.fly2;o.position.x+=Math.sin(tt*.8+i)*.01;o.position.y+=Math.cos(tt*1.1+i*1.3)*.008;o.scale.setScalar(.7+Math.sin(tt*3+i)*.4);}
    if(u.twinkle!==undefined)o.scale.setScalar(.75+Math.sin(tt*2+u.twinkle)*.3);
    if(u.bob!==undefined){o.position.y+=Math.sin(tt*1.5+u.bob)*.006;o.rotation.y=Math.sin(tt+u.bob)*.6;}
    if(u.snow){const p=o.geometry.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*(.6+(i%5)*.12);if(y<0)y=14;p.setY(i,y);p.setX(i,p.getX(i)+Math.sin(tt+i)*.004);}p.needsUpdate=true;}
    if(u.sway!==undefined)o.rotation.z=Math.sin(tt*1.2+u.sway)*.12;
    if(u.swim!==undefined){const i=u.swim,a=tt*(.25+i*.04)+i*1.3,r=4+i*.9;o.position.set(Math.cos(a)*r,1.2+i*.5+Math.sin(tt+i)*.3,-4+Math.sin(a)*r*.5-i*.4);o.rotation.y=-a+(i%2?0:0)-PI/2;}
    if(u.rise){o.position.y+=dt*u.rise;if(o.position.y>11)o.position.y=0;o.position.x+=Math.sin(tt*2+o.position.y)*.003;}
    if(u.wave!==undefined){o.position.z=-8.3-u.wave*2.5+Math.sin(tt*1.2+u.wave)*.4;}
  });
  renderer.render(scene,camera);
}

const FULL={t:[0,2.45,0],d:13.5,el:.6,rot:.3};
function showStart(){
  for(const [g,el] of[['girl','#pg'],['boy','#pb']]){const st=load(g);const url=snapChar(st,FULL,300,400);$(el).innerHTML=`<img src="${url}" alt="">`;}
  document.querySelectorAll('.pick').forEach(b=>b.disabled=false);
  $('#dress').classList.add('hidden');$('#start').classList.remove('hidden');}
document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{
  S=load(b.dataset.g);curTab='outfit';rotY=0;rotVel=0;
  $('#start').classList.add('hidden');$('#dress').classList.remove('hidden');resize();
  rebuildChar();setBg(S.bg);drawTabs();drawItems();popT=0;setTimeout(burst,60);chime('done');
  say(S.gender==='girl'?'Prinsessan! Nu ska vi klä dig fin!':'Prinsen! Nu ska vi klä dig fin!');}));
(function twinkles(){const st=$('#start');for(let i=0;i<16;i++){const s=document.createElement('div');s.className='twinkle';s.textContent=i%3?'✨':'⭐';
  s.style.left=Math.random()*96+'%';s.style.top=Math.random()*96+'%';s.style.fontSize=(14+Math.random()*20)+'px';s.style.animationDelay=(Math.random()*2.4)+'s';st.appendChild(s);}})();
showStart();
animate();
window.__game={get S(){return S;},set:(k,v)=>{S[k]=v;changed(k!=='bg');drawItems();},tab:k=>{curTab=k;drawTabs();drawItems();},setRot:a=>{rotY=a;spinTarget=null;rotVel=0;lastInteract=performance.now()+1e6;}};
</script>
