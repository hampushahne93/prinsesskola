<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiskolan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060f;
    --cyan:#2ef2ff;
    --pink:#ff3fd8;
    --lime:#9dff3f;
    --amber:#ffc23f;
    --text:#e8f6ff;
    --dim:#7f93b0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:'Exo 2',system-ui,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}

  #stars{position:fixed;inset:0;z-index:0}

  /* perspektivgolv / rutnät */
  .grid{position:fixed;left:-50%;right:-50%;bottom:-10%;height:55%;z-index:1;
    background:
      linear-gradient(transparent 0 calc(100% - 2px), rgba(46,242,255,.35) calc(100% - 2px)) 0 0/100% 60px,
      linear-gradient(90deg, transparent 0 calc(100% - 2px), rgba(46,242,255,.25) calc(100% - 2px)) 0 0/60px 100%;
    transform:perspective(500px) rotateX(62deg);transform-origin:center top;
    mask-image:linear-gradient(to top, #000 10%, transparent 90%);
    -webkit-mask-image:linear-gradient(to top, #000 10%, transparent 90%);
    animation:gridMove 3s linear infinite;opacity:.7}
  @keyframes gridMove{to{background-position:0 60px, 0 0}}

  /* planet-glöd */
  .planet{position:fixed;width:70vmin;height:70vmin;border-radius:50%;right:-18vmin;top:-22vmin;z-index:1;
    background:radial-gradient(circle at 35% 65%, #3a1f7a 0%, #1a0f3d 45%, #090514 70%);
    box-shadow:0 0 120px 30px rgba(255,63,216,.18), inset -30px 20px 80px rgba(46,242,255,.25);opacity:.85}
  .planet::after{content:"";position:absolute;inset:-12% -40%;border-radius:50%;
    border:2px solid rgba(46,242,255,.25);transform:rotate(-18deg) scaleY(.22)}

  /* scanlines + vinjett */
  .fx{position:fixed;inset:0;z-index:50;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
               radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%)}

  /* HUD-hörn */
  .hud{position:fixed;inset:18px;z-index:5;pointer-events:none}
  .hud i{position:absolute;width:46px;height:46px;border:2px solid var(--cyan);opacity:.7}
  .hud i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none}
  .hud i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none}
  .hud i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none}
  .hud i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none}
  .hud .tag{position:absolute;font:500 11px 'Orbitron',monospace;letter-spacing:.25em;color:var(--dim)}
  .hud .tl{top:14px;left:62px}
  .hud .tr{top:14px;right:62px;text-align:right}
  .hud .bl{bottom:14px;left:62px}
  .hud .br{bottom:14px;right:62px}
  .blink{animation:blink 1.2s steps(2) infinite;color:var(--lime)}
  @keyframes blink{50%{opacity:0}}

  main{position:relative;z-index:10;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5vh;padding:4vh 4vw}

  /* titel */
  .title-wrap{text-align:center;animation:drop 1s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.9)}}
  .sub{font:700 clamp(10px,1.4vw,14px) 'Orbitron',monospace;letter-spacing:.6em;color:var(--cyan);
    opacity:.8;margin-bottom:.6em}
  h1{font:900 clamp(42px,9vw,120px)/1 'Orbitron',sans-serif;letter-spacing:.04em;position:relative;
    background:linear-gradient(180deg,#fff 0%, #bff9ff 40%, var(--cyan) 60%, #6b5bff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(46,242,255,.55)) drop-shadow(0 0 40px rgba(255,63,216,.25))}
  h1::before,h1::after{content:attr(data-text);position:absolute;inset:0;
    background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
  h1.glitch::before{opacity:.8;transform:translate(-4px,0);filter:hue-rotate(90deg);clip-path:inset(10% 0 55% 0)}
  h1.glitch::after{opacity:.8;transform:translate(4px,0);filter:hue-rotate(-90deg);clip-path:inset(55% 0 10% 0)}
  .line{height:2px;width:min(520px,70vw);margin:.9em auto 0;
    background:linear-gradient(90deg,transparent,var(--cyan),var(--pink),transparent);
    box-shadow:0 0 12px var(--cyan)}

  /* kort */
  .cards{display:flex;gap:clamp(14px,2.5vw,36px);flex-wrap:wrap;justify-content:center;perspective:1000px}
  .card{--c:var(--cyan);position:relative;width:clamp(200px,24vw,290px);aspect-ratio:3/4;
    border:none;cursor:pointer;color:var(--text);background:none;outline:none;
    clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));
    transition:transform .25s ease, filter .25s;animation:rise .7s cubic-bezier(.2,1.3,.4,1) both}
  .card:nth-child(1){animation-delay:.25s}
  .card:nth-child(2){animation-delay:.4s}
  .card:nth-child(3){animation-delay:.55s}
  @keyframes rise{from{opacity:0;transform:translateY(60px) rotateX(25deg)}}
  .card .bgl{position:absolute;inset:0;
    background:linear-gradient(160deg, color-mix(in srgb,var(--c) 22%, transparent), rgba(10,14,35,.85) 45%, rgba(5,6,15,.95));
    border:2px solid color-mix(in srgb,var(--c) 55%, transparent)}
  .card .bgl::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg, transparent 0 22px, color-mix(in srgb,var(--c) 10%, transparent) 22px 23px)}
  .card .edge{position:absolute;top:0;right:0;width:40px;height:40px;
    background:linear-gradient(225deg,var(--c) 0 28px,transparent 28px)}
  .card .inner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;padding:12% 8% 10%}
  .card .num{align-self:flex-start;font:700 12px 'Orbitron',monospace;letter-spacing:.3em;color:var(--c);opacity:.85}
  .icon{width:58%;aspect-ratio:1;display:grid;place-items:center;position:relative}
  .icon .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 70%, transparent);
    animation:spin 14s linear infinite}
  .icon .ring2{position:absolute;inset:12%;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 40%, transparent);
    box-shadow:0 0 30px color-mix(in srgb,var(--c) 35%, transparent) inset}
  @keyframes spin{to{transform:rotate(360deg)}}
  .icon span{font:900 clamp(30px,4.2vw,54px) 'Orbitron',sans-serif;color:#fff;
    text-shadow:0 0 12px var(--c),0 0 30px var(--c);letter-spacing:.02em}
  .card h2{font:800 clamp(20px,2.3vw,28px) 'Exo 2',sans-serif;letter-spacing:.04em;text-align:center;
    text-shadow:0 0 10px color-mix(in srgb,var(--c) 60%, transparent)}
  .card p{font:600 13px 'Exo 2',sans-serif;color:var(--dim);text-align:center;margin-top:.3em}
  .card .go{margin-top:.8em;font:700 12px 'Orbitron',monospace;letter-spacing:.3em;color:var(--c);
    padding:.55em 1.2em;border:1px solid var(--c);opacity:.0;transform:translateY(6px);transition:.25s}

  .card:hover,.card.sel{transform:translateY(-12px) scale(1.04);
    filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 70%, transparent))}
  .card:hover .go,.card.sel .go{opacity:1;transform:none}
  .card:hover .ring,.card.sel .ring{animation-duration:3s}
  .card:active{transform:translateY(-6px) scale(.98)}
  .card.abc{--c:var(--pink)}
  .card.matte{--c:var(--cyan)}
  .card.ord{--c:var(--lime)}

  .hint{font:500 12px 'Orbitron',monospace;letter-spacing:.3em;color:var(--dim);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ljudknapp */
  .sound{position:fixed;z-index:20;bottom:46px;right:50%;transform:translateX(50%);
    background:rgba(10,14,35,.7);border:1px solid rgba(46,242,255,.4);color:var(--cyan);
    font:700 11px 'Orbitron',monospace;letter-spacing:.25em;padding:.6em 1.1em;cursor:pointer}
  .sound:hover{background:rgba(46,242,255,.12)}

  /* "kommer snart"-ruta */
  .overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:rgba(3,4,12,.75);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.3s}
  .overlay.show{opacity:1;pointer-events:auto}
  .panel{--c:var(--cyan);text-align:center;padding:44px 56px;position:relative;
    background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%, transparent),rgba(8,10,26,.95) 60%);
    border:2px solid var(--c);box-shadow:0 0 40px color-mix(in srgb,var(--c) 40%, transparent);
    clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));
    transform:scale(.85);transition:transform .35s cubic-bezier(.2,1.5,.4,1)}
  .overlay.show .panel{transform:none}
  .panel small{font:700 11px 'Orbitron',monospace;letter-spacing:.4em;color:var(--c)}
  .panel h3{font:900 clamp(26px,4vw,40px) 'Orbitron',sans-serif;margin:.4em 0 .2em;
    text-shadow:0 0 14px var(--c)}
  .panel p{color:var(--dim);font-weight:600;margin-bottom:1.6em}
  .bar{width:260px;height:8px;margin:0 auto 1.6em;border:1px solid var(--c);position:relative;overflow:hidden}
  .bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--c);box-shadow:0 0 12px var(--c);
    animation:load 1.4s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .panel button{background:none;border:2px solid var(--c);color:#fff;cursor:pointer;
    font:700 14px 'Orbitron',monospace;letter-spacing:.3em;padding:.8em 1.8em}
  .panel button:hover{background:color-mix(in srgb,var(--c) 25%, transparent)}

  @media (max-width:700px){
    .card{width:42vw;aspect-ratio:auto;min-height:200px}
    .card:nth-child(3){width:86vw;min-height:150px}
    .hud .tag{display:none}
    main{justify-content:flex-start;padding-top:9vh;overflow:auto}
    .card .go{opacity:1;transform:none}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="planet"></div>
<div class="grid"></div>

<div class="hud">
  <i></i><i></i><i></i><i></i>
  <div class="tag tl">SYS // MULTISKOLAN v0.1</div>
  <div class="tag tr" id="clock">--:--</div>
  <div class="tag bl">STATUS: <span class="blink">ONLINE</span></div>
  <div class="tag br">SEKTOR 01</div>
</div>

<main>
  <div class="title-wrap">
    <div class="sub">VÄLKOMMEN TILL</div>
    <h1 id="title" data-text="MULTISKOLAN">MULTISKOLAN</h1>
    <div class="line"></div>
  </div>

  <div class="cards" id="cards">
    <button class="card abc" data-name="ABC Skolan">
      <div class="bgl"></div><div class="edge"></div>
      <div class="inner">
        <div class="num">01</div>
        <div class="icon"><div class="ring"></div><div class="ring2"></div><span>ABC</span></div>
        <div>
          <h2>ABC Skolan</h2>
          <p>Lär dig bokstäverna</p>
        </div>
        <div class="go">▶ STARTA</div>
      </div>
    </button>

    <button class="card matte" data-name="Matteskolan">
      <div class="bgl"></div><div class="edge"></div>
      <div class="inner">
        <div class="num">02</div>
        <div class="icon"><div class="ring"></div><div class="ring2"></div><span>1+2</span></div>
        <div>
          <h2>Matteskolan</h2>
          <p>Räkna med siffror</p>
        </div>
        <div class="go">▶ STARTA</div>
      </div>
    </button>

    <button class="card ord" data-name="Ord skolan">
      <div class="bgl"></div><div class="edge"></div>
      <div class="inner">
        <div class="num">03</div>
        <div class="icon"><div class="ring"></div><div class="ring2"></div><span>ORD</span></div>
        <div>
          <h2>Ord skolan</h2>
          <p>Läs och bygg ord</p>
        </div>
        <div class="go">▶ STARTA</div>
      </div>
    </button>
  </div>

  <div class="hint">VÄLJ ETT UPPDRAG</div>
</main>

<button class="sound" id="sound">♪ LJUD: PÅ</button>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <small>LADDAR UPPDRAG</small>
    <h3 id="panelTitle">ABC Skolan</h3>
    <p>Kommer snart!</p>
    <div class="bar"></div>
    <button id="back">◀ TILLBAKA</button>
  </div>
</div>

<div class="fx"></div>

<script>
/* ---------- Stjärnfält (warp) ---------- */
const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
let W, H, stars = [], warp = 1;
function resize(){ W = cv.width = innerWidth*devicePixelRatio; H = cv.height = innerHeight*devicePixelRatio; }
addEventListener('resize', resize); resize();
for (let i=0;i<420;i++) stars.push(newStar(true));
function newStar(rand){
  return { x:(Math.random()-.5)*2, y:(Math.random()-.5)*2, z: rand ? Math.random() : 1,
           c: Math.random()<.15 ? '#ff3fd8' : (Math.random()<.3 ? '#2ef2ff' : '#ffffff') };
}
function draw(){
  ctx.fillStyle = 'rgba(5,6,15,0.35)'; ctx.fillRect(0,0,W,H);
  const cx=W/2, cy=H/2;
  for (const s of stars){
    const pz = s.z;
    s.z -= 0.0025*warp;
    if (s.z <= 0.02){ Object.assign(s, newStar(false)); continue; }
    const sx = cx + s.x/s.z*cx*.5, sy = cy + s.y/s.z*cy*.5;
    const px = cx + s.x/pz*cx*.5,  py = cy + s.y/pz*cy*.5;
    const size = (1-s.z)*2.2*devicePixelRatio;
    ctx.strokeStyle = s.c; ctx.globalAlpha = 1-s.z; ctx.lineWidth = size;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(sx,sy); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  warp += ((targetWarp) - warp)*0.05;
  requestAnimationFrame(draw);
}
let targetWarp = 1;
draw();

/* ---------- Klocka ---------- */
const clock = document.getElementById('clock');
setInterval(()=>{ const d=new Date(); clock.textContent = d.toLocaleTimeString('sv-SE'); }, 1000);

/* ---------- Glitch på titeln ---------- */
const title = document.getElementById('title');
setInterval(()=>{ title.classList.add('glitch'); setTimeout(()=>title.classList.remove('glitch'), 140); }, 3200);

/* ---------- Ljud (WebAudio, inga filer) ---------- */
let soundOn = true, ac;
function beep(freq=660, dur=.08, type='square', vol=.05, slide=0){
  if(!soundOn) return;
  ac = ac || new (window.AudioContext||window.webkitAudioContext)();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq*slide, ac.currentTime+dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}
const soundBtn = document.getElementById('sound');
soundBtn.onclick = ()=>{ soundOn=!soundOn; soundBtn.textContent = '♪ LJUD: ' + (soundOn?'PÅ':'AV'); beep(880,.06); };

/* ---------- Menyval ---------- */
const cards = [...document.querySelectorAll('.card')];
const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
let sel = -1;
function select(i){
  sel = (i+cards.length)%cards.length;
  cards.forEach((c,j)=>c.classList.toggle('sel', j===sel));
  beep(520+sel*120,.06,'square',.04);
}
cards.forEach((c,i)=>{
  c.addEventListener('mouseenter', ()=>select(i));
  c.addEventListener('click', ()=>launch(i));
});
function launch(i){
  const c = cards[i];
  document.getElementById('panelTitle').textContent = c.dataset.name;
  panel.style.setProperty('--c', getComputedStyle(c).getPropertyValue('--c'));
  beep(300,.35,'sawtooth',.05,4);
  targetWarp = 12;
  setTimeout(()=>{ overlay.classList.add('show'); }, 250);
}
function closeOverlay(){
  overlay.classList.remove('show'); targetWarp = 1; beep(700,.12,'triangle',.06,.5);
}
document.getElementById('back').onclick = closeOverlay;
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeOverlay(); });

addEventListener('keydown', e=>{
  if (overlay.classList.contains('show')){
    if (['Escape','Enter',' ','Backspace'].includes(e.key)) { e.preventDefault(); closeOverlay(); }
    return;
  }
  if (e.key==='ArrowRight'||e.key==='d') select(sel+1);
  else if (e.key==='ArrowLeft'||e.key==='a') select(sel<0?0:sel-1);
  else if ((e.key==='Enter'||e.key===' ') && sel>=0){ e.preventDefault(); launch(sel); }
});
</script>
</body>
</html>
