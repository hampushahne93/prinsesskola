<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kungliga klädskåpet</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#5a2d82; --pink:#ff7fbf; --gold:#ffcf3a; --gold-d:#d99a12;
    --panel:#fffafd; --soft:#fbe9ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#ffe3f4 0%,#efe2ff 55%,#dff0ff 100%);user-select:none;-webkit-user-select:none}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  .hidden{display:none!important}

  /* ---------- START ---------- */
  #start{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:20px;position:relative}
  #start h1{margin:0;text-align:center;font-size:clamp(34px,7vw,64px);line-height:1;font-weight:700;
    background:linear-gradient(180deg,#ffd75a,#f0a31b);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #9a5bd6) drop-shadow(0 6px 10px rgba(120,60,180,.25))}
  #start .crownTop{font-size:clamp(40px,8vw,70px);animation:float 3s ease-in-out infinite}
  #start .sub{margin:0;font-size:clamp(20px,4vw,30px);font-weight:600}
  .choose{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center}
  .pick{width:min(40vw,240px);background:#fff;border-radius:32px;padding:12px 12px 14px;
    box-shadow:0 8px 0 #e4c8f5,0 14px 30px rgba(120,60,180,.18);transition:transform .15s;display:flex;flex-direction:column;align-items:center}
  .pick:active{transform:scale(.95)}
  .pick svg{width:100%;height:min(42vh,320px)}
  .pick span{font-size:clamp(24px,4.5vw,36px);font-weight:700;margin-top:4px}
  .pick[data-g="girl"] span{color:#ff5aa8}
  .pick[data-g="boy"] span{color:#4a6fe0}
  .twinkle{position:absolute;pointer-events:none;animation:tw 2.4s ease-in-out infinite;opacity:.7}

  /* ---------- DRESS ---------- */
  #dress{height:100dvh;display:flex;flex-direction:column}
  .stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 6px 20px rgba(90,45,130,.15)}
  .stage .bg{position:absolute;inset:0;width:100%;height:100%}
  .hero{position:absolute;left:0;right:0;bottom:1%;height:84%;width:100%;animation:bob 3.2s ease-in-out infinite;cursor:pointer}
  .hero.pop{animation:pop .45s ease-out}
  .fx{position:absolute;inset:0;pointer-events:none}
  .fx span{position:absolute;animation:burst .9s ease-out forwards}
  .topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center}
  .topbar .spacer{flex:1}
  .round{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);font-size:28px;
    box-shadow:0 4px 0 rgba(150,100,190,.35);display:grid;place-items:center;transition:transform .12s}
  .round:active,.pill:active{transform:scale(.9)}
  .pill{height:56px;padding:0 22px;border-radius:30px;font-size:26px;font-weight:700;color:#7a3f00;
    background:linear-gradient(180deg,#ffe27a,#ffbf2e);box-shadow:0 5px 0 #d08a10,0 8px 18px rgba(200,130,0,.3)}

  .panel{flex:0 0 auto;height:46%;display:flex;flex-direction:column;padding:10px 10px 12px;gap:8px;min-height:0}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;flex:0 0 auto}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;width:62px;height:62px;border-radius:20px;background:#fff;font-size:32px;display:grid;place-items:center;
    box-shadow:0 4px 0 #ead4f7;transition:transform .12s,background .2s}
  .tab svg{width:38px;height:38px}
  .tab.on{background:linear-gradient(180deg,#ffb3dc,#ff86c4);box-shadow:0 4px 0 #e0559c;transform:translateY(-3px) scale(1.06)}
  .items{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,100px);grid-auto-rows:100px;gap:10px;padding:4px;align-content:start;justify-content:center}
  .item{width:100%;height:100%;border-radius:22px;background:#fff;border:4px solid #fff;box-shadow:0 4px 0 #ead4f7;overflow:hidden;position:relative;transition:transform .12s;padding:0}
  .item svg{width:100%;height:100%;display:block}
  .item:active{transform:scale(.92)}
  .item.on{border-color:var(--gold);box-shadow:0 0 0 3px #fff3b0,0 4px 0 var(--gold-d),0 0 18px rgba(255,200,40,.7)}
  .item.on::after{content:'⭐';position:absolute;top:2px;right:4px;font-size:18px}
  .item .none{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:.55}
  .item.wide svg{border-radius:16px}
  .colors{flex:0 0 auto;display:flex;gap:10px;overflow-x:auto;padding:4px 4px 6px;scrollbar-width:none}
  .colors::-webkit-scrollbar{display:none}
  .col{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 rgba(120,60,180,.25);transition:transform .12s}
  .col.on{transform:scale(1.18);box-shadow:0 0 0 3px var(--gold),0 3px 0 rgba(120,60,180,.25)}
  .col:active{transform:scale(.9)}

  @media (min-aspect-ratio: 1/1){
    #dress{flex-direction:row}
    .stage{border-radius:0 28px 28px 0}
    .panel{height:auto;width:min(44vw,430px);padding:12px}
    .items{grid-template-columns:repeat(auto-fill,112px);grid-auto-rows:112px}
    .hero{height:90%}
  }

  /* ---------- SHOW ---------- */
  #show{position:fixed;inset:0;z-index:10;background:#000}
  #show .bg{position:absolute;inset:0;width:100%;height:100%}
  #show .hero{height:80%;bottom:3%;animation:dance 1.6s ease-in-out infinite}
  .showtitle{position:absolute;top:4%;left:0;right:0;text-align:center;font-size:clamp(30px,6vw,56px);font-weight:700;color:#fff;
    text-shadow:0 3px 0 #b0459a,0 0 18px rgba(255,120,200,.9);padding:0 16px;animation:pop .6s ease-out}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti span{position:absolute;top:-10%;animation:fall linear forwards}
  #back{position:absolute;bottom:4%;left:50%;transform:translateX(-50%)}
  #back:active{transform:translateX(-50%) scale(.92)}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
  @keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
  @keyframes dance{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-2%)}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  @keyframes tw{0%,100%{transform:scale(.6);opacity:.3}50%{transform:scale(1.1);opacity:.9}}
  @keyframes burst{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(40deg);opacity:0}}
  @keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
</style>
</head>
<body>

<div id="start">
  <div class="crownTop">👑</div>
  <h1>Kungliga<br>klädskåpet</h1>
  <p class="sub">Vem vill du vara?</p>
  <div class="choose">
    <button class="pick" data-g="girl"><svg id="pg" viewBox="20 0 260 480" preserveAspectRatio="xMidYMid meet"></svg><span>Tjej</span></button>
    <button class="pick" data-g="boy"><svg id="pb" viewBox="20 0 260 480" preserveAspectRatio="xMidYMid meet"></svg><span>Kille</span></button>
  </div>
</div>

<div id="dress" class="hidden">
  <div class="stage" id="stage">
    <svg class="bg" id="bgsvg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"></svg>
    <svg class="hero" id="hero" viewBox="0 0 300 480" preserveAspectRatio="xMidYMax meet"></svg>
    <div class="fx" id="fx"></div>
    <div class="topbar">
      <button id="home" class="round" aria-label="Börja om">🏠</button>
      <div class="spacer"></div>
      <button id="sound" class="round" aria-label="Ljud">🔊</button>
      <button id="magic" class="round" aria-label="Trolla">🎲</button>
      <button id="done" class="pill">✨ Klar!</button>
    </div>
  </div>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
    <div class="colors" id="colors"></div>
  </div>
</div>

<div id="show" class="hidden">
  <svg class="bg" id="showbg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"></svg>
  <svg class="hero" id="showhero" viewBox="0 0 300 480" preserveAspectRatio="xMidYMax meet"></svg>
  <div class="confetti" id="confetti"></div>
  <div class="showtitle" id="showtitle"></div>
  <button id="back" class="pill">👗 Klä om</button>
</div>

<script>
/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const G='#ffcf3a', GD='#d99a12', GL='#fff3b0';
function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function shade(h,a){const c=hex2rgb(h);const t=a<0?0:255,p=Math.abs(a);
  return '#'+c.map(v=>Math.round(v+(t-v)*p).toString(16).padStart(2,'0')).join('');}
function rng(seed){return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
function star(cx,cy,r,fill,extra=''){let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;
  d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}return `<path d="${d}Z" fill="${fill}" ${extra}/>`;}
function qpts(x0,y0,cx,cy,x1,y1,n){const p=[];for(let i=0;i<n;i++){const t=n===1?.5:i/(n-1),u=1-t;
  p.push([u*u*x0+2*u*t*cx+t*t*x1,u*u*y0+2*u*t*cy+t*t*y1]);}return p;}
const M = s => `<g transform="translate(300 0) scale(-1 1)">${s}</g>`; // spegla runt mitten
const both = s => s + M(s);
function sparkles(seed,x,y,w,h,n,cols,r=2.2){const R=rng(seed);let o='';for(let i=0;i<n;i++){
  o+=`<circle cx="${(x+R()*w).toFixed(1)}" cy="${(y+R()*h).toFixed(1)}" r="${(r*(.6+R()*.8)).toFixed(1)}" fill="${cols[i%cols.length]}" opacity=".9"/>`;}return o;}
function stars(seed,x,y,w,h,n,cols,r=6){const R=rng(seed);let o='';for(let i=0;i<n;i++)o+=star(x+R()*w,y+R()*h,r*(.6+R()*.7),cols[i%cols.length]);return o;}
function ermineDots(pts){return pts.map(([x,y])=>`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="1.6" ry="3.2" fill="#2a2233"/>`).join('');}

/* ================= PALETTES ================= */
const DRESS=[['#ff8fc8','Rosa'],['#b98cff','Lila'],['#7cc4ff','Ljusblå'],['#ffcf3a','Guld'],['#ff5b6e','Röd'],['#f3eeff','Vit'],['#5fd3a0','Grön'],['#4a5fe0','Kungsblå'],['#ff9f4a','Orange'],['#3a2f6a','Midnattsblå']];
const HAIRP=[['#ffd66b','Blont'],['#c98a4b','Ljusbrunt'],['#7a4a2a','Brunt'],['#2e211c','Svart'],['#d9582b','Rött'],['#ff9fd0','Rosa'],['#b48cff','Lila'],['#8fd3ff','Blått'],['#f4f4f4','Vitt']];
const CAPEP=[['#c8203f','Kungaröd'],...DRESS];

/* ================= BODY ================= */
const legs = s => `<rect x="130" y="296" width="17" height="148" rx="8" fill="${s}"/><rect x="153" y="296" width="17" height="148" rx="8" fill="${s}"/>`;
const neckB = s => `<rect x="141" y="160" width="18" height="46" rx="7" fill="${s}"/><rect x="141" y="168" width="18" height="10" fill="${shade(s,-.12)}"/>`;
const arms = s => both(`<path d="M116 206 Q100 252 98 292" stroke="${s}" stroke-width="16" fill="none" stroke-linecap="round"/>`);
const torso = s => `<path d="M114 200 Q150 192 186 200 L182 244 L118 244Z" fill="${s}"/>`;
const hands = s => both(`<circle cx="98" cy="296" r="10.5" fill="${s}"/>`);
const head = s => both(`<circle cx="90" cy="126" r="11" fill="${s}"/><circle cx="91" cy="126" r="5" fill="${shade(s,-.12)}"/>`)+`<circle cx="150" cy="115" r="61" fill="${s}"/>`;
function face(g,s){
  const lash = g==='girl' ? both(`<path d="M120 116 L113 110 M123 112 L119 105 M128 111 L127 104" stroke="#3a2a4a" stroke-width="2.5" stroke-linecap="round"/>`) : '';
  return `<g class="eyes">${both(`<ellipse cx="128" cy="123" rx="8.5" ry="10.5" fill="#3a2a4a"/><circle cx="131" cy="119" r="3.4" fill="#fff"/><circle cx="125.5" cy="127" r="1.6" fill="#fff"/>`)}</g>
  ${lash}
  ${both(`<path d="M118 103 Q128 97 138 102" stroke="#6a4a3a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>`)}
  ${both(`<ellipse cx="112" cy="143" rx="10" ry="6" fill="#ff6f9f" opacity=".32"/>`)}
  <path d="M147 135 Q150 138 153 135" stroke="${shade(s,-.25)}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M137 148 Q150 164 163 148 Q150 154 137 148Z" fill="#e0607e" stroke="#c2456a" stroke-width="2.5" stroke-linejoin="round"/>`;
}

/* ================= HAIR ================= */
const capA = c => `<path d="M86 126 C78 22 222 22 214 126 C211 106 203 92 190 84 C170 100 128 104 104 90 C95 100 89 112 86 126Z" fill="${c}"/>`;
const capB = c => `<path d="M86 124 C80 22 220 22 214 124 C210 108 205 98 198 92 Q186 104 174 92 Q162 104 150 92 Q138 104 126 92 Q114 104 102 92 C95 98 90 108 86 124Z" fill="${c}"/>`;
const capC = c => `<path d="M88 116 C82 26 218 26 212 116 C208 100 200 90 190 84 Q178 94 166 84 Q154 96 140 84 Q124 94 112 84 C100 90 92 102 88 116Z" fill="${c}"/>`;
const shine = c => `<path d="M116 56 Q138 44 166 48" stroke="${shade(c,.45)}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>`;
const shortBack = c => `<path d="M86 112 C80 26 220 26 214 112 L214 142 L86 142Z" fill="${c}"/>`;
function braid(c){const d=shade(c,-.22);let o='';for(let i=0;i<7;i++){o+=`<ellipse cx="${95-i*.6}" cy="${150+i*19}" rx="12.5" ry="11.5" fill="${c}" stroke="${d}" stroke-width="2"/>`;}
  return o+`<path d="M92 282 L80 274 L80 292Z M92 282 L104 274 L104 292Z" fill="#ff7fbf"/><circle cx="92" cy="283" r="4.5" fill="#ff5aa8"/><path d="M88 286 Q86 300 90 306 M96 286 Q98 300 94 306" stroke="${c}" stroke-width="5" stroke-linecap="round" fill="none"/>`;}
const HAIRS=[
  {id:'lang',name:'Långt hår',draw:c=>({back:`<path d="M82 112 C76 22 224 22 218 112 L226 258 Q200 272 176 262 Q150 274 124 262 Q100 272 74 258Z" fill="${c}"/><path d="M100 160 Q96 215 100 256 M200 160 Q204 215 200 256 M114 190 Q112 230 116 262 M186 190 Q188 230 184 262" stroke="${shade(c,-.25)}" stroke-width="3" fill="none" opacity=".35"/>`,front:capB(c)+shine(c)})},
  {id:'lockar',name:'Lockigt hår',draw:c=>{const R=rng(7);let b=`<path d="M82 112 C76 22 224 22 218 112 L218 150 L82 150Z" fill="${c}"/>`;
    for(let y=100;y<=250;y+=24){b+=`<circle cx="${80+R()*8}" cy="${y}" r="21" fill="${c}" stroke="${shade(c,-.18)}" stroke-width="2"/><circle cx="${220-R()*8}" cy="${y}" r="21" fill="${c}" stroke="${shade(c,-.18)}" stroke-width="2"/>`;}
    return {back:b,front:capA(c)+`<circle cx="104" cy="92" r="9" fill="${c}"/><circle cx="196" cy="88" r="9" fill="${c}"/>`+shine(c)};}},
  {id:'knut',name:'Hårknut',draw:c=>({back:shortBack(c)+`<circle cx="150" cy="40" r="28" fill="${c}"/><path d="M134 36 Q150 18 166 38 Q156 52 142 44" stroke="${shade(c,-.25)}" stroke-width="3" fill="none"/>`,front:capA(c)+shine(c)})},
  {id:'flator',name:'Flätor',draw:c=>({back:shortBack(c),front:capB(c)+shine(c)+braid(c)+M(braid(c))})},
  {id:'svans',name:'Hästsvans',draw:c=>({back:shortBack(c)+`<path d="M196 70 C254 80 262 170 236 238 C232 205 224 160 198 112Z" fill="${c}"/><path d="M214 110 Q234 160 230 210" stroke="${shade(c,-.25)}" stroke-width="3" fill="none" opacity=".4"/>`,front:capA(c)+`<circle cx="205" cy="80" r="8" fill="#ff7fbf"/>`+shine(c)})},
  {id:'page',name:'Pagefrisyr',draw:c=>({back:`<path d="M82 112 C76 22 224 22 218 112 L220 184 Q206 196 190 186 L110 186 Q94 196 80 184Z" fill="${c}"/>`,front:capB(c)+shine(c)})},
  {id:'kort',name:'Kort hår',draw:c=>({back:shortBack(c),front:capC(c)+`<path d="M140 52 Q146 32 160 38 Q150 44 152 56Z" fill="${c}"/>`+shine(c)})},
  {id:'lockkort',name:'Korta lockar',draw:c=>{let f=capC(c);[[110,72],[129,56],[150,50],[171,56],[190,72],[98,94],[202,94]].forEach(([x,y])=>f+=`<circle cx="${x}" cy="${y}" r="15" fill="${c}" stroke="${shade(c,-.15)}" stroke-width="2"/>`);
    return {back:shortBack(c),front:f};}},
];

/* ================= CROWNS ================= */
function flowerAt(x,y,col){let o='';for(let i=0;i<5;i++){const a=i*Math.PI*2/5;o+=`<circle cx="${(x+5.5*Math.cos(a)).toFixed(1)}" cy="${(y+5.5*Math.sin(a)).toFixed(1)}" r="5.5" fill="${col}"/>`;}
  return o+`<circle cx="${x}" cy="${y}" r="4" fill="#ffd84a"/>`;}
const CROWNS=[
  {id:'none',name:'Ingen krona',draw:()=>''},
  {id:'tiara',name:'Silvertiara',draw:()=>`<path d="M106 82 Q150 54 194 82 L190 89 Q150 64 110 89Z" fill="#eef2ff" stroke="#9fb0d9" stroke-width="2"/>
    <path d="M118 75 L126 54 L136 66 L150 36 L164 66 L174 54 L182 75 Q150 61 118 75Z" fill="#f2f5ff" stroke="#9fb0d9" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M150 48 Q143 58 150 67 Q157 58 150 48Z" fill="#ff6fb5" stroke="#fff" stroke-width="1.5"/>
    <circle cx="126" cy="59" r="3.5" fill="#7cc4ff"/><circle cx="174" cy="59" r="3.5" fill="#7cc4ff"/><circle cx="150" cy="36" r="3" fill="#fff"/>`},
  {id:'guld',name:'Guldkrona',draw:()=>`<path d="M108 72 L102 26 L127 50 L150 14 L173 50 L198 26 L192 72Z" fill="${G}" stroke="${GD}" stroke-width="3" stroke-linejoin="round"/>
    <rect x="104" y="64" width="92" height="16" rx="6" fill="${GD}"/>
    <circle cx="102" cy="26" r="6" fill="${GL}" stroke="${GD}" stroke-width="2"/><circle cx="150" cy="14" r="6" fill="${GL}" stroke="${GD}" stroke-width="2"/><circle cx="198" cy="26" r="6" fill="${GL}" stroke="${GD}" stroke-width="2"/>
    <circle cx="124" cy="72" r="5" fill="#ff3d6e"/><circle cx="150" cy="72" r="6" fill="#4ab0ff"/><circle cx="176" cy="72" r="5" fill="#3bd18a"/>
    <path d="M118 58 L116 42" stroke="#fff" stroke-width="3" opacity=".6" stroke-linecap="round"/>`},
  {id:'kunga',name:'Kungakrona',draw:()=>`<path d="M110 72 Q112 24 150 22 Q188 24 190 72Z" fill="#c8203f"/>
    <path d="M110 72 Q118 28 150 26 Q182 28 190 72 M150 26 L150 72 M128 70 Q130 36 150 26 M172 70 Q170 36 150 26" stroke="${G}" stroke-width="5" fill="none" stroke-linecap="round"/>
    ${qpts(110,72,150,-16,190,72,9).map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${(y+2).toFixed(1)}" r="2.6" fill="#fff"/>`).join('')}
    <circle cx="150" cy="20" r="8" fill="${G}" stroke="${GD}" stroke-width="2"/><rect x="146.5" y="-2" width="7" height="18" rx="2" fill="${G}"/><rect x="141" y="3" width="18" height="6" rx="2" fill="${G}"/>
    <rect x="104" y="64" width="92" height="16" rx="6" fill="${G}" stroke="${GD}" stroke-width="2"/>
    <circle cx="122" cy="72" r="4.5" fill="#4ab0ff"/><circle cx="150" cy="72" r="5.5" fill="#3bd18a"/><circle cx="178" cy="72" r="4.5" fill="#4ab0ff"/>`},
  {id:'liten',name:'Lilla kronan',draw:()=>`<g transform="rotate(-14 150 50)"><path d="M126 64 L122 32 L138 47 L150 26 L162 47 L178 32 L174 64Z" fill="${G}" stroke="${GD}" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="122" y="57" width="56" height="11" rx="4" fill="${GD}"/><circle cx="122" cy="32" r="4.5" fill="${GL}"/><circle cx="150" cy="26" r="4.5" fill="${GL}"/><circle cx="178" cy="32" r="4.5" fill="${GL}"/>
    <path d="M150 42 l6 8 l-6 8 l-6 -8Z" fill="#ff6fb5"/></g>`},

    <path d="M150 42 L163 57 L150 82 L137 57Z" fill="#a66bff" stroke="${G}" stroke-width="3" stroke-linejoin="round"/><path d="M144 55 L150 47" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

    ${fl}
    <path d="M0 0 L70 0 Q60 150 90 290 L0 290Z" fill="#d6284f"/><path d="M400 0 L330 0 Q340 150 310 290 L400 290Z" fill="#d6284f"/>

    ${[150,175,200,225,250].map((x,i)=>`<rect x="${x-3}" y="${i%4?84:74}" width="6" height="12" fill="#fff"/><circle cx="${x}" cy="${i%4?80:70}" r="4" fill="#ffe27a"/>`).join('')}
    <circle cx="200" cy="64" r="8" fill="${G}"/>${sparkles(41,0,0,400,280,24,['#fff','#ffe27a'],2)}`;}},
  {id:'tradgard',name:'Trädgården',draw:p=>`<defs><linearGradient id="${p}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e0ff"/><stop offset="1" stop-color="#f0fbff"/></linearGradient></defs>

    <path d="M110 300 L110 170 Q200 70 290 170 L290 300" stroke="#fff" stroke-width="12" fill="none"/>
    ${qpts(110,190,200,40,290,190,11).map(([x,y],i)=>`<circle cx="${x.toFixed(1)}" cy="${(y+16).toFixed(1)}" r="9" fill="${i%2?'#ff5b6e':'#ff8fc8'}"/>`).join('')}
    <path d="M0 300 Q200 280 400 300 L400 400 L0 400Z" fill="#8ad97f"/><path d="M160 400 L185 300 L215 300 L240 400Z" fill="#f2dfb8"/>
    ${[[40,330],[90,360],[320,340],[360,370],[60,390],[340,395]].map(([x,y],i)=>flowerAt(x,y,['#ff8fc8','#fff','#b98cff'][i%3])).join('')}`},

/* ================= RENDER CHARACTER ================= */
const byId=(list,id)=>list.find(x=>x.id===id)||list[0];
function render(st,opt={}){
  const s=st.skin,out=byId(ALL_OUT,st.outfit),hair=byId(HAIRS,st.hairStyle).draw(st.hairColor);
  const cape=byId(CAPES,st.cape),cp=cape.draw?cape.draw(st.capeColor):{back:'',front:''};
  const shoes=byId(SHOES,st.shoes).draw();
  let o=`<ellipse cx="150" cy="452" rx="80" ry="11" fill="#000" opacity=".14"/>`;
  o+=cp.back+hair.back+legs(s);
  if(!out.over)o+=shoes;
  o+=neckB(s)+arms(s)+torso(s)+out.draw(st.outfitColor,s);
  if(out.over)o+=shoes;
  o+=cp.front+byId(NECKS,st.necklace).draw()+head(s)+face(st.gender,s)+hair.front;
  if(!opt.noCrown)o+=byId(CROWNS,st.crown).draw();
  o+=byId(ACCS,st.acc).draw()+hands(s);
  return o;
}

/* ================= STATE ================= */
const DEFAULTS={
  girl:{gender:'girl',skin:'#f5c6a0',hairStyle:'lang',hairColor:'#ffd66b',outfit:'prinsess',outfitColor:'#ff8fc8',crown:'tiara',cape:'none',capeColor:'#b98cff',shoes:'glas',necklace:'parlor',acc:'stav',bg:'slott'},
  boy:{gender:'boy',skin:'#f5c6a0',hairStyle:'kort',hairColor:'#7a4a2a',outfit:'prins',outfitColor:'#4a5fe0',crown:'guld',cape:'kort',capeColor:'#c8203f',shoes:'roda',necklace:'none',acc:'spira',bg:'slott'}
};
let S=null, curTab='outfit', muted=false;
function load(g){try{const j=localStorage.getItem('kk-'+g);if(j)return Object.assign({},DEFAULTS[g],JSON.parse(j));}catch(e){}return {...DEFAULTS[g]};}
function save(){try{localStorage.setItem('kk-'+S.gender,JSON.stringify(S));}catch(e){}}

/* ================= SOUND & VOICE ================= */
let ac=null,svVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();svVoice=v.find(x=>/^sv/i.test(x.lang))||null;}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function say(t){if(muted||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';if(svVoice)u.voice=svVoice;u.rate=.92;u.pitch=1.2;speechSynthesis.speak(u);}catch(e){}}
function chime(kind){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const notes=kind==='done'?[523,659,784,1047,1319,1568]:kind==='tab'?[660]:[988+Math.floor(Math.random()*4)*110,1480];
  notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
    const t=ac.currentTime+i*(kind==='done'?.11:.07);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(kind==='tab'?.08:.16,t+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.6);});}catch(e){}}

/* ================= UI ================= */
const CAPE_ICON=`<svg viewBox="0 0 40 40"><path d="M12 6 L28 6 L36 36 Q20 40 4 36Z" fill="#d6284f"/><circle cx="13" cy="8" r="3" fill="${G}"/><circle cx="27" cy="8" r="3" fill="${G}"/></svg>`;
const TABS=[
  {k:'outfit',icon:()=>S.gender==='girl'?'👗':'🤴',name:'Kläder',vb:'38 180 224 290',items:()=>OUTFITS[S.gender],color:'outfitColor',pal:DRESS},
  {k:'crown',icon:()=>'👑',name:'Kronor',vb:'85 -2 130 112',items:()=>CROWNS},
  {k:'hairStyle',icon:()=>'💇',name:'Frisyrer',vb:'45 22 210 272',items:()=>HAIRS,color:'hairColor',pal:HAIRP,noCrown:true},
  {k:'cape',icon:()=>CAPE_ICON,name:'Mantlar',vb:'18 140 264 340',items:()=>CAPES,color:'capeColor',pal:CAPEP},
  {k:'shoes',icon:()=>'👠',name:'Skor',vb:'104 378 92 78',items:()=>SHOES},
  {k:'necklace',icon:()=>'💎',name:'Smycken',vb:'110 178 80 72',items:()=>NECKS},
  {k:'acc',icon:()=>'🪄',name:'Saker att hålla',vb:'150 180 110 140',items:()=>ACCS},
  {k:'skin',icon:()=>'🙂',name:'Hudfärg',vb:'78 48 144 144',items:()=>SKINS},
  {k:'bg',icon:()=>'🏰',name:'Platser',items:()=>BGS,isBg:true},
];
let uid=0;
function bgSvg(id){const b=byId(BGS,id);return b.draw('g'+(uid++));}

function drawHero(){ $('#hero').innerHTML=render(S); $('#bgsvg').innerHTML=bgSvg(S.bg); }
function popHero(){const h=$('#hero');h.classList.remove('pop');void h.getBoundingClientRect();h.classList.add('pop');}
$('#hero').addEventListener('animationend',e=>{if(e.animationName==='pop')$('#hero').classList.remove('pop');});

function drawTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.k===curTab?'on':''}" data-k="${t.k}" aria-label="${t.name}">${t.icon()}</button>`).join('');
}
function drawItems(){
  const t=TABS.find(x=>x.k===curTab);const list=t.items();
  $('#items').innerHTML=list.map(it=>{
    const on=S[t.k]===it.id?'on':'';
    if(t.isBg)return `<button class="item wide ${on}" data-id="${it.id}"><svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">${bgSvg(it.id)}</svg></button>`;
    const st={...S,[t.k]:it.id};
    const none=it.id==='none'?'<div class="none">✖️</div>':'';
    return `<button class="item ${on}" data-id="${it.id}"><svg viewBox="${t.vb}">${render(st,{noCrown:t.noCrown})}</svg>${none}</button>`;
  }).join('');
  const cw=$('#colors');
  if(t.color){cw.classList.remove('hidden');cw.innerHTML=t.pal.map(([c,n])=>`<button class="col ${S[t.color]===c?'on':''}" data-c="${c}" data-n="${n}" style="background:${c}" aria-label="${n}"></button>`).join('');}
  else{cw.classList.add('hidden');cw.innerHTML='';}
}
function burst(){const fx=$('#fx');const syms=['✨','⭐','💖','💫','🌟'];
  for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=syms[i%5];const a=Math.random()*Math.PI*2,d=70+Math.random()*130;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.left='50%';s.style.top=(35+Math.random()*30)+'%';
    s.style.fontSize=(18+Math.random()*18)+'px';fx.appendChild(s);setTimeout(()=>s.remove(),950);}}
function changed(){save();drawHero();popHero();burst();chime();}

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;curTab=b.dataset.k;drawTabs();drawItems();$('#items').scrollTop=0;chime('tab');
  say(TABS.find(t=>t.k===curTab).name);});
$('#items').addEventListener('click',e=>{const b=e.target.closest('.item');if(!b)return;const t=TABS.find(x=>x.k===curTab);
  const it=t.items().find(x=>x.id===b.dataset.id);S[t.k]=it.id;changed();drawItems();say(it.name||'Så fint!');});
$('#colors').addEventListener('click',e=>{const b=e.target.closest('.col');if(!b)return;const t=TABS.find(x=>x.k===curTab);
  S[t.color]=b.dataset.c;changed();drawItems();say(b.dataset.n);});

const PHRASES={girl:['Jag är en prinsessa!','Titta så fin jag är!','Hihi!','Ska vi gå på bal?','Jag älskar min krona!'],
               boy:['Jag är en prins!','Titta så fin jag är!','Hihi!','Ska vi gå på bal?','Jag älskar min krona!']};
$('#hero').addEventListener('click',()=>{popHero();burst();chime();const p=PHRASES[S.gender];say(p[Math.floor(Math.random()*p.length)]);});

function pick(list){return list[Math.floor(Math.random()*list.length)];}
$('#magic').addEventListener('click',()=>{
  S.outfit=pick(OUTFITS[S.gender]).id;S.outfitColor=pick(DRESS)[0];S.crown=pick(CROWNS.slice(1)).id;S.hairStyle=pick(HAIRS).id;S.hairColor=pick(HAIRP)[0];
  S.cape=pick(CAPES).id;S.capeColor=pick(CAPEP)[0];S.shoes=pick(SHOES).id;S.necklace=pick(NECKS).id;S.acc=pick(ACCS).id;S.bg=pick(BGS).id;
  changed();drawItems();setTimeout(burst,150);say('Simsalabim!');});
$('#sound').addEventListener('click',()=>{muted=!muted;$('#sound').textContent=muted?'🔇':'🔊';try{if(muted)speechSynthesis.cancel();}catch(e){}if(!muted)chime();});
$('#home').addEventListener('click',()=>{showStart();chime('tab');});

/* ---------- show ---------- */
$('#done').addEventListener('click',()=>{
  $('#showbg').innerHTML=bgSvg(S.bg);$('#showhero').innerHTML=render(S);
  const title=S.gender==='girl'?'Vilken vacker prinsessa!':'Vilken stilig prins!';$('#showtitle').textContent=title;
  $('#show').classList.remove('hidden');chime('done');say(title);
  const cf=$('#confetti');cf.innerHTML='';const syms=['👑','✨','💖','⭐','🎉','💎','🌸'];
  for(let i=0;i<46;i++){const s=document.createElement('span');s.textContent=syms[i%syms.length];s.style.left=Math.random()*100+'%';
    s.style.fontSize=(18+Math.random()*24)+'px';s.style.animationDuration=(2.6+Math.random()*2.6)+'s';s.style.animationDelay=(Math.random()*1.8)+'s';cf.appendChild(s);}
});
$('#back').addEventListener('click',()=>{$('#show').classList.add('hidden');chime('tab');});

/* ---------- start ---------- */
function showStart(){
  $('#pg').innerHTML=render(load('girl'));$('#pb').innerHTML=render(load('boy'));
  $('#dress').classList.add('hidden');$('#start').classList.remove('hidden');
}
document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>{
  S=load(b.dataset.g);curTab='outfit';
  $('#start').classList.add('hidden');$('#dress').classList.remove('hidden');
  drawTabs();drawItems();drawHero();setTimeout(()=>{popHero();burst();},60);chime('done');
  say(S.gender==='girl'?'Prinsessan! Nu ska vi klä dig fin!':'Prinsen! Nu ska vi klä dig fin!');
}));
(function twinkles(){const st=$('#start');for(let i=0;i<16;i++){const s=document.createElement('div');s.className='twinkle';s.textContent=i%3?'✨':'⭐';
  s.style.left=Math.random()*96+'%';s.style.top=Math.random()*96+'%';s.style.fontSize=(14+Math.random()*20)+'px';s.style.animationDelay=(Math.random()*2.4)+'s';st.appendChild(s);}})();
showStart();
</script>
